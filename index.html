<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasrik Bakkal – Preisfinder</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

:root {
  --red: #b5121b;
  --dark: #171717;
  --gold: #d6a72c;
  --cream: #fffaf0;
  --light: #f5f5f5;
  --green: #167447;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 0 auto;
  padding: 12px;
  background: var(--light);
  color: var(--dark);
}

/* KOPF */

.header {
  background: var(--dark);
  color: white;
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
  border-bottom: 5px solid var(--gold);
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 5px 0 0;
  color: #eee;
}

/* SCANNER */

.scanner-box {
  background: white;
  border-radius: 14px;
  padding: 7px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

#reader {
  max-width: 360px;
  margin: auto;
}

/* BUTTONS */

button {
  border: none;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

.scan-button {
  background: var(--red);
  color: white;
}

.share-button {
  background: var(--gold);
  color: #171717;
}

.clear-button {
  background: #777;
  color: white;
}

.quantity-button {
  background: #eee;
  color: #111;
  padding: 6px 11px;
  margin: 0 3px;
}

/* ERGEBNIS */

.result {
  background: white;
  border-radius: 14px;
  padding: 17px;
  text-align: center;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.product {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 5px;
}

.price {
  color: var(--red);
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 10px;
}

input {
  width: 90%;
  padding: 11px;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-top: 8px;
}

/* WARENKORB */

.cart {
  background: white;
  border-radius: 14px;
  padding: 17px;
  margin-top: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.cart-title {
  font-size: 22px;
  font-weight: bold;
  border-bottom: 3px solid var(--gold);
  padding-bottom: 8px;
  margin-bottom: 8px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 7px;
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
}

.cart-name {
  flex: 1;
  text-align: left;
}

.cart-price {
  white-space: nowrap;
  font-weight: bold;
}

.total {
  font-size: 25px;
  font-weight: bold;
  text-align: right;
  margin-top: 15px;
  color: var(--red);
}

.cart-buttons {
  text-align: center;
  margin-top: 12px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 12px;
}

/* FEHLER */

.not-found {
  color: var(--red);
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin: 20px 0;
}

</style>
</head>

<body>

<!-- KOPF -->

<div class="header">
  <h1>🛒 KASRIK BAKKAL</h1>
  <p>Preisfinder</p>
</div>


<!-- SCANNER -->

<div class="scanner-box">
  <div id="reader"></div>
</div>


<div style="text-align:center;">

  <button
    class="scan-button"
    onclick="startScanner()">

    📷 Weiter scannen

  </button>

</div>


<!-- ERGEBNIS -->

<div class="result" id="resultBox">

  <div id="resultText">
    Bitte einen Barcode scannen.
  </div>

  <input
    type="text"
    id="manualCode"
    placeholder="EAN manuell eingeben"
    inputmode="numeric">

  <br>

  <button
    onclick="searchManual()">

    Preis suchen

  </button>

</div>


<!-- WARENKORB -->

<div class="cart">

  <div class="cart-title">
    🛒 Mein Warenkorb
  </div>

  <div id="cartItems">

    <div class="empty">
      Noch keine Artikel
    </div>

  </div>

  <div class="total">

    Gesamt:
    <span id="cartTotal">
