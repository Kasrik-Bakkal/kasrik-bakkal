input {

}

}


/* =========================================================
   HEADER – ALT KÖŞELER
   ========================================================= */

}

/* Kompakter Scanner */
#reader {

}

/* Pluszeichen nur sandfarben */

/* Warenkorb-Buttons gleich groß und dicht beieinander */

}

/* Fleischbestellung */
.meat-order-box {

}

.meat-order-button {

}

.order-info-row {

</style>

<!-- =======================================================
     ET & TAVUK / FLEISCHBESTELLUNG
     ======================================================= -->

<div class="box meat-order-box" id="meatOrder">

</div>


<script>


/* =========================================================
   PRODUKTDATEN
   ========================================================= */

const PRODUCT_DATA_URL = "produkte.json";

let products = null;

let cart = {};

let scanner = null;

let scanning = false;

let alreadyScanned = false;

let torchOn = false;


/* =========================================================
   PRODUKTDATEN LADEN
   ========================================================= */

async function loadProducts() {

  if (products) {
    return products;
  }

  const response = await fetch(
    PRODUCT_DATA_URL + "?v=" + Date.now()
  );

  if (!response.ok) {

    throw new Error(
      "Produktdaten konnten nicht geladen werden."
    );

  }

  products = await response.json();

  return products;

}


/* =========================================================
   EINZELNES PRODUKT LADEN
   ========================================================= */

async function getProduct(code) {

  const data =
    await loadProducts();

  const cleanCode =
    String(code).trim();

  const product =
    data[cleanCode];

  if (!product) {
    return null;
  }

  return {

    code:
      String(product.barcode),

    name:
      product.produkt || "",

    price:
      Number(product.preis) || 0,

    marke:
      product.marke || "",

    paket:
      product.paket || "",

    einheit:
      product.einheit || ""

  };

}


/* =========================================================
   PREIS FORMATIEREN
   ========================================================= */

function formatPrice(price) {

  return Number(price)
    .toFixed(2)
    .replace(".", ",") + " €";

}


/* =========================================================
   HTML SICHER MACHEN
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   PRODUKT ANZEIGEN
   ========================================================= */

async function showProduct(code) {

  const result =
    document.getElementById(
      "resultText"
    );

  result.innerHTML =
    t("searchLoading");


  try {

    const product =
      await getProduct(code);


    if (!product) {

      result.innerHTML =

        '<div class="not-found">' +

        '❌ Artikel nicht gefunden' +

        '<br><br>' +

        'EAN: ' +

        escapeHtml(code) +

        '</div>';

      return;

    }


    result.dataset.hasProduct = "true";

    result.innerHTML =

      '<div class="brand">' +
      escapeHtml(product.marke) +
      '</div>' +

      '<div class="product">' +
      escapeHtml(product.name) +
      '</div>' +

      '<div class="package">' +
      escapeHtml(product.paket) +
      '</div>' +

      '<div class="price">' +
      formatPrice(product.price) +
      '</div>' +

      '<button ' +
      'id="addResultButton" ' +
      'class="light-button">' +

      '<span class="plus-icon">➕</span> ' + t("add") +

      '</button>';


    const addButton =
      document.getElementById(
        "addResultButton"
      );


    addButton.addEventListener(
      "click",
      function() {

        addToCart(product);
        document.getElementById("resultText").dataset.hasProduct = "";
        document.getElementById("resultText").textContent = t("resultDefault");

      }
    );


  } catch (error) {

    console.error(error);

    result.innerHTML =

      '<div class="not-found">' +

      '❌ Produktdaten konnten nicht geladen werden.' +

      '<br><br>' +

      'Bitte erneut versuchen.' +

      '</div>';

  }

}


/* =========================================================
   WARENKORB – ARTIKEL HINZUFÜGEN
   ========================================================= */

function addToCart(product) {

  const code =
    product.code;


  if (cart[code]) {

    cart[code].quantity++;

  } else {

    cart[code] = {

      code:
        product.code,

      name:
        product.name,

      marke:
        product.marke,

      paket:
        product.paket,

      price:
        product.price,

      quantity:
        1

    };

  }


  updateCart();

  document.getElementById("resultText").textContent = t("resultDefault");

}


/* =========================================================
   MENGE ÄNDERN
   ========================================================= */

function changeQuantity(
  code,
  change
) {

  if (!cart[code]) {
    return;
  }


  cart[code].quantity +=
    change;


  if (
    cart[code].quantity <= 0
  ) {

    delete cart[code];

  }


  updateCart();

}


/* =========================================================
   WARENKORB AKTUALISIEREN
   ========================================================= */

function updateCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  const codes =
    Object.keys(cart);


  if (codes.length === 0) {

    container.innerHTML =

      '<div class="empty">' +

      'Henüz ürün yok' +

      '</div>';


    document
      .getElementById("cartTotal")
      .textContent =
      "0,00 €";


    return;

  }


  container.innerHTML = "";

  let total = 0;


  codes.forEach(
    function(code) {

      const item =
        cart[code];


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      const itemBox =
        document.createElement(
          "div"
        );

      itemBox.className =
        "cart-item";


      /* Produktname */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "cart-name";

      name.textContent =
        item.name;


      /* Marke */

      const brand =
        document.createElement(
          "div"
        );

      brand.className =
        "cart-brand";

      brand.textContent =
        item.marke;


      /* Packung */

      const packageInfo =
        document.createElement(
          "div"
        );

      packageInfo.className =
        "cart-package";

      packageInfo.textContent =
        item.paket;


      /* Controls */

      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "cart-controls";


      const quantityControls =
        document.createElement(
          "div"
        );

      quantityControls.className =
        "quantity-controls";


      /* Minus */

      const minus =
        document.createElement(
          "button"
        );

      minus.className =
        "quantity-button";

      minus.textContent =
        "−";


      minus.addEventListener(
        "click",
        function() {

          changeQuantity(
            code,
            -1
          );

        }
      );


      /* Menge */

      const quantity =
        document.createElement(
          "span"
        );

      quantity.className =
        "quantity-number";

      quantity.textContent =
        item.quantity;


      /* Plus */

      const plus =
        document.createElement(
          "button"
        );

      plus.className =
        "quantity-button";

      plus.textContent =
        "+";


      plus.addEventListener(
        "click",
        function() {

          changeQuantity(
            code,
            1
          );

        }
      );


      quantityControls.appendChild(
        minus
      );

      quantityControls.appendChild(
        quantity
      );

      quantityControls.appendChild(
        plus
      );


      /* Preis */

      const price =
        document.createElement(
          "div"
        );

      price.className =
        "cart-price";

      price.textContent =
        item.quantity +
        " × " +
        formatPrice(item.price) +
        " = " +
        formatPrice(itemTotal);


      controls.appendChild(
        quantityControls
      );

      controls.appendChild(
        price
      );


      itemBox.appendChild(
        name
      );


      if (item.marke) {

        itemBox.appendChild(
          brand
        );

      }


      if (item.paket) {

        itemBox.appendChild(
          packageInfo
        );

      }


      itemBox.appendChild(
        controls
      );


      container.appendChild(
        itemBox
      );

    }
  );


  document
    .getElementById("cartTotal")
    .textContent =
    formatPrice(total);

}


/* =========================================================
   WARENKORB LEEREN
   ========================================================= */

function clearCart() {

  cart = {};

  updateCart();


  /*
     Auch das zuletzt angezeigte
     Produkt löschen.
  */

  document
    .getElementById(
      "resultText"
    )
    .innerHTML =

      t("resultDefault");

}


/* =========================================================
   HAUPTSUCHE
   BARCODE + MARKE + PRODUKT + PACKUNG
   ========================================================= */

async function searchMain() {

  const input =
    document.getElementById(
      "mainSearch"
    );


  const search =
    input.value
      .trim()
      .toLowerCase();


  const container =
    document.getElementById(
      "searchResults"
    );


  /* Keine Eingabe */

  if (!search) {

    container.innerHTML = "";

    return;

  }


  container.innerHTML =
    "🔎 Suche...";


  try {

    const data =
      await loadProducts();


    /*
       Wenn es eine exakte
       Barcode-Suche ist,
       Produkt direkt anzeigen.
    */

    const exactProduct =
      data[input.value.trim()];


    if (exactProduct) {

      container.innerHTML = "";


      const result =
        document.createElement(
          "div"
        );

      result.className =
        "search-result";


      result.innerHTML =

        '<div class="search-result-brand">' +
        escapeHtml(
          exactProduct.marke || ""
        ) +
        '</div>' +

        '<div class="search-result-product">' +
        escapeHtml(
          exactProduct.produkt || ""
        ) +
        '</div>' +

        '<div class="search-result-package">' +
        escapeHtml(
          exactProduct.paket || ""
        ) +
        '</div>' +

        '<div class="search-result-price">' +
        formatPrice(
          exactProduct.preis
        ) +
        '</div>';


      result.addEventListener(
        "click",
        function() {

          showProduct(
            exactProduct.barcode
          );

          container.innerHTML = "";

        }
      );


      container.appendChild(
        result
      );


      return;

    }


    /*
       Normale Textsuche
    */

    const matches =
      Object.values(data)
        .filter(
          function(product) {

            const text =

              String(
                product.barcode || ""
              ) +

              " " +

              String(
                product.marke || ""
              ) +

              " " +

              String(
                product.produkt || ""
              ) +

              " " +

              String(
                product.paket || ""
              );


            return text
              .toLowerCase()
              .includes(search);

          }
        );


    if (
      matches.length === 0
    ) {

      container.innerHTML =

        '<div class="empty">' +

        t("noArticles") +

        '</div>';

      return;

    }


    container.innerHTML = "";


    matches.forEach(
      function(product) {

        const result =
          document.createElement(
            "div"
          );

        result.className =
          "search-result";


        const brand =
          document.createElement(
            "div"
          );

        brand.className =
          "search-result-brand";

        brand.textContent =
          product.marke || "";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "search-result-product";

        name.textContent =
          product.produkt || "";


        const packageInfo =
          document.createElement(
            "div"
          );

        packageInfo.className =
          "search-result-package";

        packageInfo.textContent =
          product.paket || "";


        const price =
          document.createElement(
            "div"
          );

        price.className =
          "search-result-price";

        price.textContent =
          formatPrice(
            product.preis
          );


        result.appendChild(
          brand
        );

        result.appendChild(
          name
        );


        if (product.paket) {

          result.appendChild(
            packageInfo
          );

        }


        result.appendChild(
          price
        );


        /*
           WICHTIG:
           Nur Produkt anzeigen.
           NICHT automatisch
           zum Warenkorb hinzufügen.
        */

        result.addEventListener(
          "click",
          function() {

            showProduct(
              product.barcode
            );

            container.innerHTML = "";

          }
        );


        container.appendChild(
          result
        );

      }
    );


  } catch (error) {

    console.error(error);

    container.innerHTML =

      '<div class="not-found">' +

      t("searchError") +

      '</div>';

  }

}


/* =========================================================
   SCANNER – ERFOLGREICHER SCAN
   ========================================================= */

function onScanSuccess(
  decodedText
) {

  if (alreadyScanned) {
    return;
  }


  alreadyScanned = true;


  showProduct(
    decodedText
  );


  stopScanner();

}


/* =========================================================
   SCANNER – FEHLER
   ========================================================= */

function onScanFailure(
  error
) {

  /*
     Normale Scanfehler
     werden ignoriert.
  */

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

function startScanner() {

  if (scanning) {
    return;
  }


  alreadyScanned = false;


  /*
     Taschenlampenstatus
     für neuen Scan zurücksetzen.
  */

  torchOn = false;


  const torchButton =
    document.getElementById(
      "torchButton"
    );


  torchButton.textContent =
    "🔦 Işık";


  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 15,

      qrbox: {
        width: 280,
        height: 130
      }

    },

    onScanSuccess,

    onScanFailure

  )


  .then(
    function() {

      scanning = true;

    }
  )


  .catch(
    function(error) {

      console.error(error);

      scanning = false;


      document
        .getElementById(
          "resultText"
        )
        .innerHTML =

          '<div class="not-found">' +

          t("cameraError") +

          '<br><br>' +

          'Bitte Kamera-Berechtigung prüfen.' +

          '</div>';

    }
  );

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {
    return;
  }


  scanner.stop()

    .then(
      function() {

        scanning = false;

        /*
           Wichtig:
           Nach dem Scannen wird
           der Lichtstatus zurückgesetzt.
        */

        torchOn = false;


        document
          .getElementById(
            "torchButton"
          )
          .textContent =
          t("light");

      }
    )


    .catch(
      function(error) {

        console.error(error);

        scanning = false;

        torchOn = false;


        document
          .getElementById(
            "torchButton"
          )
          .textContent =
          t("light");

      }
    );

}


/* =========================================================
   TASCHENLAMPE
   ========================================================= */

async function toggleTorch() {

  if (
    !scanner ||
    !scanning
  ) {

    alert(
      t("scannerFirst")
    );

    return;

  }


  try {

    const capabilities =
      scanner.getRunningTrackCapabilities();


    if (
      !capabilities ||
      !capabilities.torch
    ) {

      alert(
        t("torchUnsupported")
      );

      return;

    }


    torchOn =
      !torchOn;


    await scanner.applyVideoConstraints({

      advanced: [

        {
          torch:
            torchOn
        }

      ]

    });


    const button =
      document.getElementById(
        "torchButton"
      );


    button.textContent =

      torchOn

        ? "🔦 Işık aus"

        : "🔦 Işık";


  } catch (error) {

    console.error(error);

    alert(
      t("torchError")
    );

  }

}


/* =========================================================
   EINKAUFSLISTE TEILEN
   ========================================================= */

async function shareCart() {

  const codes =
    Object.keys(cart);


  if (
    codes.length === 0
  ) {

    alert(
      t("emptyWarning")
    );

    return;

  }


  const now =
    new Date();


  const date =
    now.toLocaleDateString(
      "de-DE"
    );


  const time =
    now.toLocaleTimeString(
      "de-DE",
      {
        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );


  let text =
    "🛒 KASRIK BAKKAL\n";


  text +=
    "--------------------------------\n";


  text +=
    "Datum: " +
    date +
    "\n";


  text +=
    "Uhrzeit: " +
    time +
    "\n\n";


  let total = 0;


  codes.forEach(
    function(code) {

      const item =
        cart[code];


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      text +=
        (item.marke || "") +
        "\n";


      text +=
        (item.name || "") +
        "\n";


      text +=
        (item.paket || "") +
        "\n";


      text +=
        item.quantity +
        " × " +
        formatPrice(
          item.price
        ) +
        " = " +
        formatPrice(
          itemTotal
        ) +
        "\n\n";

    }
  );


  text +=
    "--------------------------------\n";


  text +=
    "GESAMT: " +
    formatPrice(total) +
    "\n\n";


  text +=
    t("thanks") + "\n";


  text +=
    "Kasrik Bakkal";


  /*
     Handy-Teilen
  */

  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          t("shareTitle"),

        text:
          text

      });

    } catch (error) {

      console.log(
        "Teilen abgebrochen."
      );

    }


  } else {

    /*
       Falls navigator.share
       nicht verfügbar ist.
    */

    try {

      await navigator.clipboard
        .writeText(text);


      alert(
        t("copied")
      );


    } catch (error) {

      alert(text);

    }

  }

}

let currentLanguage = localStorage.getItem("kasrikLanguage") || "tr";
function t(key){ return translations[currentLanguage][key] || translations.tr[key] || key; }

function isoWeek(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const day=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-day);
  const y=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-y)/86400000)+1)/7);
}
function nextSaturday(parity){
  const now=new Date();
  for(let i=0;i<15;i++){
    const d=new Date(now); d.setHours(0,0,0,0); d.setDate(now.getDate()+i);
    if(d.getDay()===6 && isoWeek(d)%2===parity) return d;
  }
  return now;
}
function formatDate(d){
  return d.toLocaleDateString(currentLanguage==="tr"?"tr-TR":"de-DE",
    {weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
}
function updateOrderDates(){
  document.getElementById("orderDeadlineValue").textContent =
    formatDate(nextSaturday(1)) + (currentLanguage==="tr"?", 18:00":", 18:00 Uhr");
  document.getElementById("pickupValue").textContent =
    formatDate(nextSaturday(0)) + (currentLanguage==="tr"?", 12:00–18:00":", 12:00–18:00 Uhr");
}
function applyLanguage(){
  document.documentElement.lang=currentLanguage==="tr"?"tr":"de";
  document.getElementById("headerSubtitle").textContent=t("headerSubtitle");
  document.querySelector(".search-label").textContent=t("searchLabel");
  document.getElementById("scannerTitle").textContent=t("scannerTitle");
  document.querySelectorAll(".section-title")[1].textContent=t("cartTitle");
  document.getElementById("scanButton").textContent=t("startScanner");
  document.getElementById("torchButton").textContent=torchOn?t("lightOff"):t("light");
  document.getElementById("clearButtonText").textContent=t("clear");
  document.getElementById("shareButtonText").textContent=t("share");
  document.getElementById("orderDeadlineLabel").textContent=t("deadline");
  document.getElementById("pickupLabel").textContent=t("pickup");
  document.getElementById("meatOrderButton").textContent=t("orderButton");
  document.getElementById("footerDisclaimer").textContent=t("disclaimer");
  document.getElementById("footerCopyright").textContent=t("copyright");
  document.getElementById("totalLabel").textContent=t("total");
  document.getElementById("languageButton").textContent=currentLanguage==="tr"?"🇹🇷 Türkçe ▾":"🇩🇪 Deutsch";
  const result=document.getElementById("resultText");
  if(!result.dataset.hasProduct) result.textContent=t("resultDefault");
  if(Object.keys(cart).length===0) document.getElementById("cartItems").innerHTML='<div class="empty">'+t("emptyCart")+'</div>';
  updateOrderDates();
  const add=document.getElementById("addResultButton");
  if(add) add.innerHTML='<span class="plus-icon">➕</span> '+t("add");
}
function setLanguage(lang){
  if(!translations[lang]) return;
  currentLanguage=lang; localStorage.setItem("kasrikLanguage",lang);
  document.getElementById("languageMenu").classList.add("hidden"); applyLanguage();
}
document.getElementById("languageButton").addEventListener("click",e=>{
  e.stopPropagation(); document.getElementById("languageMenu").classList.toggle("hidden");
});
document.querySelectorAll("#languageMenu button").forEach(b=>b.addEventListener("click",e=>{
  e.stopPropagation(); setLanguage(b.dataset.lang);
}));
