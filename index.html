<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasrik Bakkal – Preisfinder</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

:root {
  --red: #b5121b;
  --dark: #171717;
  --gold: #d6a72c;
  --cream: #fffaf0;
  --light: #f5f5f5;
  --green: #167447;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 0 auto;
  padding: 12px;
  background: var(--light);
  color: var(--dark);
}

/* KOPF */

.header {
  background: var(--dark);
  color: white;
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
  border-bottom: 5px solid var(--gold);
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 5px 0 0;
  color: #eee;
}

/* SCANNER */

.scanner-box {
  background: white;
  border-radius: 14px;
  padding: 7px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

#reader {
  max-width: 360px;
  margin: auto;
}

/* BUTTONS */

button {
  border: none;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

.scan-button {
  background: var(--red);
  color: white;
}

.share-button {
  background: var(--gold);
  color: #171717;
}

.clear-button {
  background: #777;
  color: white;
}

.quantity-button {
  background: #eee;
  color: #111;
  padding: 6px 11px;
  margin: 0 3px;
}

/* ERGEBNIS */

.result {
  background: white;
  border-radius: 14px;
  padding: 17px;
  text-align: center;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.product {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 5px;
}

.price {
  color: var(--red);
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 10px;
}

input {
  width: 90%;
  padding: 11px;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-top: 8px;
}

/* WARENKORB */

.cart {
  background: white;
  border-radius: 14px;
  padding: 17px;
  margin-top: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.cart-title {
  font-size: 22px;
  font-weight: bold;
  border-bottom: 3px solid var(--gold);
  padding-bottom: 8px;
  margin-bottom: 8px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 7px;
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
}

.cart-name {
  flex: 1;
  text-align: left;
}

.cart-price {
  white-space: nowrap;
  font-weight: bold;
}

.total {
  font-size: 25px;
  font-weight: bold;
  text-align: right;
  margin-top: 15px;
  color: var(--red);
}

.cart-buttons {
  text-align: center;
  margin-top: 12px;
}

.empty {
  text-align: center;
  color: #777;
  padding: 12px;
}

/* FEHLER */

.not-found {
  color: var(--red);
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin: 20px 0;
}

</style>
</head>

<body>

<!-- KOPF -->

<div class="header">

  <h1>🛒 KASRIK BAKKAL</h1>

  <p>Preisfinder</p>

</div>


<!-- SCANNER -->

<div class="scanner-box">

  <div id="reader"></div>

</div>


<div style="text-align:center;">

  <button
    class="scan-button"
    onclick="startScanner()">

    📷 Weiter scannen

  </button>

</div>


<!-- ERGEBNIS -->

<div class="result" id="resultBox">

  <div id="resultText">

    Bitte einen Barcode scannen.

  </div>


  <input
    type="text"
    id="manualCode"
    placeholder="EAN manuell eingeben"
    inputmode="numeric">


  <br>


  <button
    onclick="searchManual()">

    Preis suchen

  </button>

</div>


<!-- WARENKORB -->

<div class="cart">

  <div class="cart-title">

    🛒 Mein Warenkorb

  </div>


  <div id="cartItems">

    <div class="empty">

      Noch keine Artikel

    </div>

  </div>


  <div class="total">

    Gesamt:
    <span id="cartTotal">
      0,00 €
    </span>

  </div>


  <!-- BUTTONS -->

  <div class="cart-buttons">

    <button
      class="scan-button"
      onclick="startScanner()">

      📷 Weiter scannen

    </button>


    <br>


    <button
      class="share-button"
      onclick="shareCart()">

      📸 Einkaufsliste speichern / teilen

    </button>


    <br>


    <button
      class="clear-button"
      onclick="clearCart()">

      🗑️ Warenkorb leeren

    </button>

  </div>

</div>


<div class="footer">

  Kasrik Bakkal

</div>


<script>

/* PRODUKTE */

const products = {

  "200000000001": {
    name: "Spaghetti 500 g",
    price: 1.49
  },

  "200000000002": {
    name: "Penne 500 g",
    price: 1.59
  },

  "200000000003": {
    name: "Basmati Reis 1 kg",
    price: 2.99
  },

  "200000000004": {
    name: "Tomaten gehackt 400 g",
    price: 1.19
  },

  "200000000005": {
    name: "Kichererbsen 400 g",
    price: 1.29
  },

  "200000000006": {
    name: "Weiße Bohnen 400 g",
    price: 1.39
  },

  "200000000007": {
    name: "Oliven grün 500 g",
    price: 3.49
  },

  "200000000008": {
    name: "Tomatenmark 200 g",
    price: 0.99
  },

  "200000000009": {
    name: "Rote Linsen 500 g",
    price: 2.19
  },

  "200000000010": {
    name: "Bulgur 1 kg",
    price: 2.49
  },

  "4061461435721": {
    name: "Kräuterli",
    price: 1.29
  }

};


let scanner = null;

let scanning = false;

let alreadyScanned = false;

let cart = {};


/* PREIS FORMATIEREN */

function formatPrice(price) {

  return price
    .toFixed(2)
    .replace(".", ",") + " €";

}


/* PRODUKT ANZEIGEN */

function showProduct(code) {

  const result =
    document.getElementById("resultText");

  const product =
    products[code];


  if (!product) {

    result.innerHTML =

      '<div class="not-found">' +

      'Artikel nicht gefunden<br><br>' +

      'EAN: ' + code +

      '</div>';

    return;

  }


  result.innerHTML =

    '<div class="product">' +

    product.name +

    '</div>' +

    '<div class="price">' +

    formatPrice(product.price) +

    '</div>';


  addToCart(code);


  setTimeout(function() {

    document
      .getElementById("resultBox")
      .scrollIntoView({
        behavior: "smooth",
        block: "start"
      });

  }, 100);

}


/* WARENKORB */

function addToCart(code) {

  if (!products[code]) return;


  if (cart[code]) {

    cart[code].quantity++;

  }

  else {

    cart[code] = {

      name: products[code].name,

      price: products[code].price,

      quantity: 1

    };

  }


  updateCart();

}


function changeQuantity(code, change) {

  if (!cart[code]) return;


  cart[code].quantity += change;


  if (cart[code].quantity <= 0) {

    delete cart[code];

  }


  updateCart();

}


function updateCart() {

  const container =
    document.getElementById("cartItems");


  const codes =
    Object.keys(cart);


  if (codes.length === 0) {

    container.innerHTML =

      '<div class="empty">' +

      'Noch keine Artikel' +

      '</div>';


    document
      .getElementById("cartTotal")
      .textContent = "0,00 €";


    return;

  }


  let html = "";

  let total = 0;


  codes.forEach(function(code) {

    const item = cart[code];


    const itemTotal =
      item.price * item.quantity;


    total += itemTotal;


    html +=

      '<div class="cart-item">' +

        '<div class="cart-name">' +

          '<strong>' +

          item.name +

          '</strong><br>' +

          formatPrice(item.price) +

        '</div>' +


        '<div>' +

          '<button ' +

          'class="quantity-button" ' +

          'onclick="changeQuantity(\'' +

          code +

          '\', -1)">' +

          '−' +

          '</button>' +


          item.quantity +


          '<button ' +

          'class="quantity-button" ' +

          'onclick="changeQuantity(\'' +

          code +

          '\', 1)">' +

          '+' +

          '</button>' +

        '</div>' +


        '<div class="cart-price">' +

          formatPrice(itemTotal) +

        '</div>' +

      '</div>';

  });


  container.innerHTML = html;


  document
    .getElementById("cartTotal")
    .textContent = formatPrice(total);

}


/* WARENKORB LEEREN */

function clearCart() {

  cart = {};

  updateCart();

}


/* MANUELLE EAN */

function searchManual() {

  const code =

    document
      .getElementById("manualCode")
      .value
      .trim();


  if (code) {

    showProduct(code);

  }

}


/* SCANNER */

function onScanSuccess(decodedText) {

  if (alreadyScanned) return;


  alreadyScanned = true;


  showProduct(decodedText);


  stopScanner();

}


function onScanFailure(error) {

  // Während des Scannens sind Fehlermeldungen normal.

}


function startScanner() {

  if (scanning) return;


  alreadyScanned = false;


  if (!scanner) {

    scanner =
      new Html5Qrcode("reader");

  }


  scanner.start(

    { facingMode: "environment" },

    {

      fps: 15,

      qrbox: {

        width: 280,

        height: 130

      }

    },

    onScanSuccess,

    onScanFailure

  )


  .then(function() {

    scanning = true;

  })


  .catch(function(error) {

    document
      .getElementById("resultText")
      .innerHTML =

      '<div class="not-found">' +

      'Kamera konnte nicht gestartet werden.' +

      '</div>';

  });

}


function stopScanner() {

  if (!scanner || !scanning) return;


  scanner.stop()

    .then(function() {

      scanning = false;

    })

    .catch(function() {

      scanning = false;

    });

}


/* EINKAUFSLISTE */

async function shareCart() {

  const codes =
    Object.keys(cart);


  if (codes.length === 0) {

    alert(
      "Der Warenkorb ist noch leer."
    );

    return;

  }


  let text =
    "🛒 KASRIK BAKKAL\n";

  text +=
    "Einkaufsliste\n\n";


  let total = 0;


  codes.forEach(function(code) {

    const item = cart[code];

    const itemTotal =
      item.price * item.quantity;


    total += itemTotal;


    text +=

      item.name +

      " × " +

      item.quantity +

      " — " +

      formatPrice(itemTotal) +

      "\n";

  });


  text +=

    "\nGesamt: " +

    formatPrice(total);


  if (navigator.share) {

    try {

      await navigator.share({

        title:
          "Kasrik Bakkal Einkaufsliste",

        text: text

      });

    }

    catch(error) {

      // Teilen wurde abgebrochen.

    }

  }

  else {

    try {

      await navigator.clipboard.writeText(text);

      alert(
        "Einkaufsliste wurde kopiert."
      );

    }

    catch(error) {

      alert(text);

    }

  }

}


/* START */

startScanner();

</script>

</body>
</html>
