<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasrik Bakkal – Preisfinder</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>
:root {
  --red: #b5121b;
  --dark: #171717;
  --gold: #d6a72c;
  --light: #f5f5f5;
  --green: #167447;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 0 auto;
  padding: 12px;
  background: var(--light);
  color: var(--dark);
}

.header {
  background: var(--dark);
  color: white;
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
  border-bottom: 5px solid var(--gold);
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 5px 0 0;
  color: #eee;
}

.box {
  background: white;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

#reader {
  max-width: 360px;
  margin: auto;
}

button {
  border: none;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

button:active {
  transform: scale(0.97);
}

.red-button {
  background: var(--red);
  color: white;
}

.gold-button {
  background: var(--gold);
  color: #171717;
}

.gray-button {
  background: #777;
  color: white;
}

.light-button {
  background: #eee;
  color: #111;
}

.green-button {
  background: var(--green);
  color: white;
}

input {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-top: 7px;
}

.section-title {
  font-size: 21px;
  font-weight: bold;
  margin-bottom: 10px;
  border-bottom: 3px solid var(--gold);
  padding-bottom: 8px;
}

.result {
  text-align: center;
}

.product {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 5px;
}

.brand {
  font-size: 17px;
  color: #555;
}

.package {
  font-size: 16px;
  color: #555;
  margin-top: 4px;
}

.price {
  color: var(--red);
  font-size: 36px;
  font-weight: bold;
  margin: 10px 0;
}

.not-found {
  color: var(--red);
  font-weight: bold;
}

.search-result {
  background: #fafafa;
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
  cursor: pointer;
}

.search-result:active {
  background: #eee;
}

.search-result-brand {
  font-weight: bold;
  font-size: 15px;
}

.search-result-product {
  font-size: 18px;
  font-weight: bold;
  margin-top: 3px;
}

.search-result-package {
  color: #666;
  margin-top: 3px;
}

.search-result-price {
  color: var(--red);
  font-size: 20px;
  font-weight: bold;
  margin-top: 5px;
}

.price-list-item {
  border-bottom: 1px solid #ddd;
  padding: 11px 0;
}

.price-list-item:last-child {
  border-bottom: none;
}

.price-list-brand {
  font-weight: bold;
}

.price-list-product {
  font-size: 17px;
}

.price-list-package {
  color: #666;
  font-size: 14px;
}

.price-list-price {
  color: var(--red);
  font-weight: bold;
  font-size: 18px;
  margin-top: 3px;
}

.cart-item {
  border-bottom: 1px solid #ddd;
  padding: 12px 0;
}

.cart-item:last-child {
  border-bottom: none;
}

.cart-name {
  font-size: 17px;
  font-weight: bold;
}

.cart-brand {
  color: #555;
  font-size: 14px;
}

.cart-package {
  color: #555;
  font-size: 14px;
}

.cart-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 7px;
}

.quantity-controls {
  display: flex;
  align-items: center;
}

.quantity-button {
  background: #eee;
  color: #111;
  padding: 6px 12px;
  margin: 0 4px;
}

.quantity-number {
  font-weight: bold;
  min-width: 25px;
  text-align: center;
}

.cart-price {
  font-weight: bold;
}

.total {
  font-size: 25px;
  font-weight: bold;
  text-align: right;
  margin-top: 15px;
  color: var(--red);
}

.empty {
  text-align: center;
  color: #777;
  padding: 12px;
}

.center {
  text-align: center;
}

.hidden {
  display: none;
}

.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin: 20px 0;
}
</style>
</head>

<body>

<div class="header">
  <h1>🛒 KASRIK BAKKAL</h1>
  <p>Preisfinder</p>
</div>


<!-- SCANNER -->

<div class="box">

  <div id="reader"></div>

  <div class="center">

    <button id="scanButton" class="red-button">
      📷 Scanner starten
    </button>

    <button id="torchButton" class="gray-button">
      🔦 Licht
    </button>

  </div>

</div>


<!-- EAN SUCHE -->

<div class="box">

  <div class="section-title">
    🔢 EAN-Suche
  </div>

  <input
    type="text"
    id="manualCode"
    placeholder="EAN / Barcode eingeben"
    inputmode="numeric"
  >

  <div class="center">

    <button id="manualSearchButton" class="red-button">
      🔎 Preis suchen
    </button>

  </div>

</div>


<!-- TEXTSUCHE -->

<div class="box">

  <div class="section-title">
    🔎 Produktsuche
  </div>

  <input
    type="text"
    id="textSearch"
    placeholder="Marke, Produkt oder Packung suchen..."
  >

  <div id="searchResults"></div>

</div>


<!-- PREISLISTE -->

<div class="box">

  <div class="center">

    <button id="priceListButton" class="gold-button">
      📋 Preisliste anzeigen
    </button>

  </div>

  <div id="priceListBox" class="hidden">

    <input
      type="text"
      id="priceListSearch"
      placeholder="Preisliste durchsuchen..."
    >

    <div id="priceList"></div>

  </div>

</div>


<!-- ERGEBNIS -->

<div class="box result">

  <div id="resultText">
    Bitte einen Barcode scannen oder einen Artikel suchen.
  </div>

</div>


<!-- WARENKORB -->

<div class="box">

  <div class="section-title">
    🛒 Mein Warenkorb
  </div>

  <div id="cartItems">

    <div class="empty">
      Noch keine Artikel
    </div>

  </div>

  <div class="total">
    Gesamt:
    <span id="cartTotal">0,00 €</span>
  </div>

  <div class="center">

    <button id="shareButton" class="gold-button">
      📤 Einkaufsliste teilen
    </button>

    <button id="clearButton" class="gray-button">
      🗑️ Warenkorb leeren
    </button>

  </div>

</div>


<div class="footer">
  Kasrik Bakkal
</div>


<script>

/* =========================================================
   PRODUKTDATEN
   ========================================================= */

const PRODUCT_DATA_URL = "produkte.json";

let products = null;

let cart = {};

let scanner = null;

let scanning = false;

let alreadyScanned = false;

let torchOn = false;


/* =========================================================
   PRODUKTDATEN LADEN
   ========================================================= */

async function loadProducts() {

  if (products) {
    return products;
  }

  const response = await fetch(
    PRODUCT_DATA_URL + "?v=" + Date.now()
  );

  if (!response.ok) {
    throw new Error(
      "Produktdaten konnten nicht geladen werden."
    );
  }

  products = await response.json();

  return products;
}


/* =========================================================
   EINZELNES PRODUKT
   ========================================================= */

async function getProduct(code) {

  const data = await loadProducts();

  const cleanCode = String(code).trim();

  const product = data[cleanCode];

  if (!product) {
    return null;
  }

  return {
    code: String(product.barcode),
    name: product.produkt || "",
    price: Number(product.preis) || 0,
    marke: product.marke || "",
    paket: product.paket || "",
    einheit: product.einheit || ""
  };
}


/* =========================================================
   PREIS FORMATIEREN
   ========================================================= */

function formatPrice(price) {

  return Number(price)
    .toFixed(2)
    .replace(".", ",") + " €";

}


/* =========================================================
   HTML SICHER MACHEN
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   PRODUKT ANZEIGEN
   ========================================================= */

async function showProduct(code) {

  const result =
    document.getElementById("resultText");

  result.innerHTML =
    "🔎 Preis wird gesucht...";

  try {

    const product =
      await getProduct(code);

    if (!product) {

      result.innerHTML =
        '<div class="not-found">' +
        '❌ Artikel nicht gefunden' +
        '<br><br>' +
        'EAN: ' +
        escapeHtml(code) +
        '</div>';

      return;
    }


    result.innerHTML =

      '<div class="brand">' +
      escapeHtml(product.marke) +
      '</div>' +

      '<div class="product">' +
      escapeHtml(product.name) +
      '</div>' +

      '<div class="package">' +
      escapeHtml(product.paket) +
      '</div>' +

      '<div class="price">' +
      formatPrice(product.price) +
      '</div>' +

      '<button id="addResultButton" class="green-button">' +
      '➕ In Warenkorb' +
      '</button>';


    const addButton =
      document.getElementById("addResultButton");

    addButton.addEventListener(
      "click",
      function() {

        addToCart(product);

      }
    );


  } catch (error) {

    console.error(error);

    result.innerHTML =
      '<div class="not-found">' +
      '❌ Produktdaten konnten nicht geladen werden.' +
      '<br><br>' +
      'Bitte erneut versuchen.' +
      '</div>';

  }

}


/* =========================================================
   WARENKORB
   ========================================================= */

function addToCart(product) {

  const code = product.code;

  if (cart[code]) {

    cart[code].quantity++;

  } else {

    cart[code] = {

      code: product.code,

      name: product.name,

      marke: product.marke,

      paket: product.paket,

      price: product.price,

      quantity: 1

    };

  }

  updateCart();

}


/* =========================================================
   MENGE ÄNDERN
   ========================================================= */

function changeQuantity(code, change) {

  if (!cart[code]) {
    return;
  }

  cart[code].quantity += change;

  if (cart[code].quantity <= 0) {

    delete cart[code];

  }

  updateCart();

}


/* =========================================================
   WARENKORB AKTUALISIEREN
   ========================================================= */

function updateCart() {

  const container =
    document.getElementById("cartItems");

  const codes =
    Object.keys(cart);

  if (codes.length === 0) {

    container.innerHTML =
      '<div class="empty">' +
      'Noch keine Artikel' +
      '</div>';

    document
      .getElementById("cartTotal")
      .textContent = "0,00 €";

    return;
  }


  container.innerHTML = "";

  let total = 0;


  codes.forEach(function(code) {

    const item = cart[code];

    const itemTotal =
      item.price * item.quantity;

    total += itemTotal;


    const itemBox =
      document.createElement("div");

    itemBox.className = "cart-item";


    const name =
      document.createElement("div");

    name.className = "cart-name";

    name.textContent =
      item.name;


    const brand =
      document.createElement("div");

    brand.className = "cart-brand";

    brand.textContent =
      item.marke;


    const packageInfo =
      document.createElement("div");

    packageInfo.className = "cart-package";

    packageInfo.textContent =
      item.paket;


    const controls =
      document.createElement("div");

    controls.className =
      "cart-controls";


    const quantityControls =
      document.createElement("div");

    quantityControls.className =
      "quantity-controls";


    const minus =
      document.createElement("button");

    minus.className =
      "quantity-button";

    minus.textContent = "−";


    minus.addEventListener(
      "click",
      function() {

        changeQuantity(code, -1);

      }
    );


    const quantity =
      document.createElement("span");

    quantity.className =
      "quantity-number";

    quantity.textContent =
      item.quantity;


    const plus =
      document.createElement("button");

    plus.className =
      "quantity-button";

    plus.textContent = "+";


    plus.addEventListener(
      "click",
      function() {

        changeQuantity(code, 1);

      }
    );


    quantityControls.appendChild(minus);

    quantityControls.appendChild(quantity);

    quantityControls.appendChild(plus);


    const price =
      document.createElement("div");

    price.className =
      "cart-price";

    price.textContent =
      formatPrice(itemTotal);


    controls.appendChild(
      quantityControls
    );

    controls.appendChild(price);


    itemBox.appendChild(name);

    if (item.marke) {
      itemBox.appendChild(brand);
    }

    if (item.paket) {
      itemBox.appendChild(packageInfo);
    }

    itemBox.appendChild(controls);


    container.appendChild(itemBox);

  });


  document
    .getElementById("cartTotal")
    .textContent =
      formatPrice(total);

}


/* =========================================================
   WARENKORB LEEREN
   ========================================================= */

function clearCart() {

  cart = {};

  updateCart();

}


/* =========================================================
   MANUELLE EAN-SUCHE
   ========================================================= */

function searchManual() {

  const input =
    document.getElementById("manualCode");

  const code =
    input.value.trim();

  if (!code) {

    input.focus();

    return;

  }

  showProduct(code);

}


/* =========================================================
   TEXTSUCHE
   ========================================================= */

async function searchText() {

  const input =
    document.getElementById("textSearch");

  const search =
    input.value
      .trim()
      .toLowerCase();

  const container =
    document.getElementById("searchResults");


  if (!search) {

    container.innerHTML = "";

    return;

  }


  container.innerHTML =
    "🔎 Suche...";


  try {

    const data =
      await loadProducts();


    const matches =
      Object.values(data).filter(
        function(product) {

          const text = (

            String(product.marke || "") +
            " " +
            String(product.produkt || "") +
            " " +
            String(product.paket || "")

          ).toLowerCase();

          return text.includes(search);

        }
      );


    if (matches.length === 0) {

      container.innerHTML =
        '<div class="empty">' +
        'Keine Artikel gefunden.' +
        '</div>';

      return;

    }


    container.innerHTML = "";


    matches.forEach(function(product) {

      const result =
        document.createElement("div");

      result.className =
        "search-result";


      const brand =
        document.createElement("div");

      brand.className =
        "search-result-brand";

      brand.textContent =
        product.marke || "";


      const name =
        document.createElement("div");

      name.className =
        "search-result-product";

      name.textContent =
        product.produkt || "";


      const packageInfo =
        document.createElement("div");

      packageInfo.className =
        "search-result-package";

      packageInfo.textContent =
        product.paket || "";


      const price =
        document.createElement("div");

      price.className =
        "search-result-price";

      price.textContent =
        formatPrice(product.preis);


      result.appendChild(brand);

      result.appendChild(name);

      if (product.paket) {
        result.appendChild(packageInfo);
      }

      result.appendChild(price);


      result.addEventListener(
        "click",
        function() {

          const normalized = {

            code: String(product.barcode),

            name: product.produkt || "",

            marke: product.marke || "",

            paket: product.paket || "",

            price: Number(product.preis) || 0,

            einheit: product.einheit || ""

          };


          showProduct(
            product.barcode
          );

          addToCart(normalized);

        }
      );


      container.appendChild(result);

    });


  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="not-found">' +
      '❌ Suche konnte nicht ausgeführt werden.' +
      '</div>';

  }

}


/* =========================================================
   PREISLISTE
   ========================================================= */

async function showPriceList() {

  const box =
    document.getElementById("priceListBox");

  const button =
    document.getElementById("priceListButton");


  if (!box.classList.contains("hidden")) {

    box.classList.add("hidden");

    button.textContent =
      "📋 Preisliste anzeigen";

    return;

  }


  box.classList.remove("hidden");

  button.textContent =
    "📋 Preisliste schließen";


  await renderPriceList();

}


/* =========================================================
   PREISLISTE RENDERN
   ========================================================= */

async function renderPriceList() {

  const container =
    document.getElementById("priceList");

  container.innerHTML =
    "🔎 Preisliste wird geladen...";


  try {

    const data =
      await loadProducts();


    const productsArray =
      Object.values(data);


    productsArray.sort(
      function(a, b) {

        const aText =
          (
            String(a.marke || "") +
            " " +
            String(a.produkt || "")
          ).toLowerCase();

        const bText =
          (
            String(b.marke || "") +
            " " +
            String(b.produkt || "")
          ).toLowerCase();

        return aText.localeCompare(bText);

      }
    );


    renderPriceListItems(
      productsArray
    );


  } catch (error) {

    console.error(error);

    container.innerHTML =
      '<div class="not-found">' +
      '❌ Preisliste konnte nicht geladen werden.' +
      '</div>';

  }

}


/* =========================================================
   PREISLISTE FILTER
   ========================================================= */

async function filterPriceList() {

  const search =
    document
      .getElementById("priceListSearch")
      .value
      .trim()
      .toLowerCase();


  try {

    const data =
      await loadProducts();


    let list =
      Object.values(data);


    if (search) {

      list =
        list.filter(
          function(product) {

            const text = (

              String(product.marke || "") +
              " " +
              String(product.produkt || "") +
              " " +
              String(product.paket || "")

            ).toLowerCase();

            return text.includes(search);

          }
        );

    }


    list.sort(
      function(a, b) {

        return (
          String(a.produkt || "")
        ).localeCompare(
          String(b.produkt || "")
        );

      }
    );


    renderPriceListItems(list);


  } catch (error) {

    console.error(error);

  }

}


/* =========================================================
   PREISLISTE ARTIKEL
   ========================================================= */

function renderPriceListItems(list) {

  const container =
    document.getElementById("priceList");

  container.innerHTML = "";


  if (list.length === 0) {

    container.innerHTML =
      '<div class="empty">' +
      'Keine Artikel gefunden.' +
      '</div>';

    return;

  }


  list.forEach(function(product) {

    const item =
      document.createElement("div");

    item.className =
      "price-list-item";


    const brand =
      document.createElement("div");

    brand.className =
      "price-list-brand";

    brand.textContent =
      product.marke || "";


    const name =
      document.createElement("div");

    name.className =
      "price-list-product";

    name.textContent =
      product.produkt || "";


    const packageInfo =
      document.createElement("div");

    packageInfo.className =
      "price-list-package";

    packageInfo.textContent =
      product.paket || "";


    const price =
      document.createElement("div");

    price.className =
      "price-list-price";

    price.textContent =
      formatPrice(product.preis);


    item.appendChild(brand);

    item.appendChild(name);

    if (product.paket) {
      item.appendChild(packageInfo);
    }

    item.appendChild(price);


    item.addEventListener(
      "click",
      function() {

        const normalized = {

          code: String(product.barcode),

          name: product.produkt || "",

          marke: product.marke || "",

          paket: product.paket || "",

          price: Number(product.preis) || 0,

          einheit: product.einheit || ""

        };


        addToCart(normalized);

        window.scrollTo({
          top: document.body.scrollHeight,
          behavior: "smooth"
        });

      }
    );


    container.appendChild(item);

  });

}


/* =========================================================
   SCANNER
   ========================================================= */

function onScanSuccess(decodedText) {

  if (alreadyScanned) {
    return;
  }

  alreadyScanned = true;

  showProduct(decodedText);

  stopScanner();

}


/* =========================================================
   SCANNER FEHLER
   ========================================================= */

function onScanFailure(error) {

  // normale Scanfehler ignorieren

}


/* =========================================================
   SCANNER START
   ========================================================= */

function startScanner() {

  if (scanning) {
    return;
  }


  alreadyScanned = false;


  if (!scanner) {

    scanner =
      new Html5Qrcode("reader");

  }


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 15,

      qrbox: {
        width: 280,
        height: 130
      }

    },

    onScanSuccess,

    onScanFailure

  )

  .then(function() {

    scanning = true;

  })

  .catch(function(error) {

    console.error(error);

    scanning = false;

    document
      .getElementById("resultText")
      .innerHTML =
        '<div class="not-found">' +
        '❌ Kamera konnte nicht gestartet werden.' +
        '<br><br>' +
        'Bitte Kamera-Berechtigung prüfen.' +
        '</div>';

  });

}


/* =========================================================
   SCANNER STOPP
   ========================================================= */

function stopScanner() {

  if (!scanner || !scanning) {
    return;
  }


  scanner.stop()

    .then(function() {

      scanning = false;

    })

    .catch(function(error) {

      console.error(error);

      scanning = false;

    });

}


/* =========================================================
   TASCHENLAMPE
   ========================================================= */

async function toggleTorch() {

  if (!scanner || !scanning) {

    alert(
      "Bitte zuerst den Scanner starten."
    );

    return;

  }


  try {

    const capabilities =
      scanner.getRunningTrackCapabilities();


    if (!capabilities ||
        !capabilities.torch) {

      alert(
        "Die Taschenlampe wird von diesem Handy bzw. Browser nicht unterstützt."
      );

      return;

    }


    torchOn = !torchOn;


    await scanner.applyVideoConstraints({

      advanced: [
        {
          torch: torchOn
        }
      ]

    });


    const button =
      document.getElementById(
        "torchButton"
      );


    button.textContent =
      torchOn
        ? "🔦 Licht aus"
        : "🔦 Licht";


  } catch (error) {

    console.error(error);

    alert(
      "Die Taschenlampe konnte nicht geschaltet werden."
    );

  }

}


/* =========================================================
   TEILEN
   ========================================================= */

async function shareCart() {

  const codes =
    Object.keys(cart);


  if (codes.length === 0) {

    alert(
      "Der Warenkorb ist noch leer."
    );

    return;

  }


  const now =
    new Date();


  const date =
    now.toLocaleDateString(
      "de-DE"
    );


  const time =
    now.toLocaleTimeString(
      "de-DE",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  let text =
    "🛒 KASRIK BAKKAL\n";

  text +=
    "--------------------------------\n";

  text +=
    "Datum: " +
    date +
    "\n";

  text +=
    "Uhrzeit: " +
    time +
    "\n\n";


  let total = 0;


  codes.forEach(function(code) {

    const item =
      cart[code];


    const itemTotal =
      item.price *
      item.quantity;


    total += itemTotal;


    text +=
      (item.marke || "") +
      "\n";

    text +=
      (item.name || "") +
      "\n";

    text +=
      (item.paket || "") +
      "\n";

    text +=
      item.quantity +
      " × " +
      formatPrice(item.price) +
      " = " +
      formatPrice(itemTotal) +
      "\n\n";

  });


  text +=
    "--------------------------------\n";

  text +=
    "GESAMT: " +
    formatPrice(total) +
    "\n\n";

  text +=
    "Vielen Dank für Ihren Einkauf!\n";

  text +=
    "Kasrik Bakkal";


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "Kasrik Bakkal Einkaufsliste",

        text: text

      });

    } catch (error) {

      console.log(
        "Teilen abgebrochen."
      );

    }

  } else {

    try {

      await navigator.clipboard.writeText(
        text
      );

      alert(
        "Einkaufsliste wurde kopiert."
      );

    } catch (error) {

      alert(text);

    }

  }

}
