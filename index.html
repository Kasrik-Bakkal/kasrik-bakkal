<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kasrik Bakkal – Preisfinder</title>

<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<style>

/* =========================================================
   KASRIK BAKKAL
   VARIANTE 27 – BORDEAUX & SAND
   ========================================================= */

:root {
  --bordeaux: #672635;
  --sand: #C8B08E;
  --background: #F6F0E5;

  --white: #ffffff;
  --text: #292323;
  --muted: #716966;
  --border: #ddd2c5;
  --soft: #faf7f2;
  --danger: #8f2637;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 0 auto;
  padding: 12px;
  background: var(--background);
  color: var(--text);
}

/* =========================================================
   HEADER
   ========================================================= */

.header {
  background: var(--bordeaux);
  color: white;
  border-radius: 16px;
  padding: 18px 16px;
  text-align: center;
  margin-bottom: 12px;
  border-bottom: 5px solid var(--sand);
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 5px 0 0;
  color: #f4e9e3;
}

/* =========================================================
   BOXEN
   ========================================================= */

.box {
  background: var(--white);
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(103, 38, 53, 0.10);
}

/* =========================================================
   SUCHLEISTE
   ========================================================= */

.search-box {
  position: relative;
}

.search-label {
  font-size: 18px;
  font-weight: bold;
  color: var(--bordeaux);
  margin-bottom: 7px;
}

#mainSearch {
  width: 100%;
  padding: 14px;
  font-size: 17px;
  border: 2px solid var(--sand);
  border-radius: 10px;
  background: #fffdf9;
  color: var(--text);
  outline: none;
}

#mainSearch:focus {
  border-color: var(--bordeaux);
}

.search-results {
  margin-top: 8px;
}

/* =========================================================
   SCANNER
   ========================================================= */

#reader {
  max-width: 360px;
  margin: auto;
}

.scanner-buttons {
  text-align: center;
  margin-top: 8px;
}

button {
  border: none;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

button:active {
  transform: scale(0.97);
}

.bordeaux-button {
  background: var(--bordeaux);
  color: white;
}

.sand-button {
  background: var(--sand);
  color: var(--text);
}

.gray-button {
  background: #777;
  color: white;
}

.light-button {
  background: #eee;
  color: #222;
}

/* =========================================================
   TITEL
   ========================================================= */

.section-title {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 10px;
  border-bottom: 3px solid var(--sand);
  padding-bottom: 8px;
  color: var(--bordeaux);
}

/* =========================================================
   SUCHERGEBNISSE
   ========================================================= */

.search-result {
  background: var(--soft);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-top: 8px;
  cursor: pointer;
}

.search-result:active {
  background: #f0e8de;
}

.search-result-brand {
  font-weight: bold;
  font-size: 15px;
  color: var(--bordeaux);
}

.search-result-product {
  font-size: 18px;
  font-weight: bold;
  margin-top: 3px;
}

.search-result-package {
  color: var(--muted);
  margin-top: 3px;
}

.search-result-price {
  color: var(--bordeaux);
  font-size: 20px;
  font-weight: bold;
  margin-top: 5px;
}

/* =========================================================
   ERGEBNIS
   ========================================================= */

.result {
  text-align: center;
}

.product {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 5px;
}

.brand {
  font-size: 17px;
  color: var(--muted);
}

.package {
  font-size: 16px;
  color: var(--muted);
  margin-top: 4px;
}

.price {
  color: var(--bordeaux);
  font-size: 36px;
  font-weight: bold;
  margin: 10px 0;
}

.not-found {
  color: var(--danger);
  font-weight: bold;
}

.result-info {
  color: var(--muted);
  font-size: 14px;
  margin-top: 8px;
}

/* =========================================================
   WARENKORB
   ========================================================= */

.cart-item {
  border-bottom: 1px solid var(--border);
  padding: 12px 0;
}

.cart-item:last-child {
  border-bottom: none;
}

.cart-name {
  font-size: 17px;
  font-weight: bold;
}

.cart-brand {
  color: var(--muted);
  font-size: 14px;
}

.cart-package {
  color: var(--muted);
  font-size: 14px;
}

.cart-controls {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 7px;
}

.quantity-controls {
  display: flex;
  align-items: center;
}

.quantity-button {
  background: #eee;
  color: #111;
  padding: 6px 12px;
  margin: 0 4px;
}

.quantity-number {
  font-weight: bold;
  min-width: 25px;
  text-align: center;
}

.cart-price {
  font-weight: bold;
}

.total {
  font-size: 25px;
  font-weight: bold;
  text-align: right;
  margin-top: 15px;
  color: var(--bordeaux);
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 12px;
}

.center {
  text-align: center;
}

/* =========================================================
   ALLGEMEIN
   ========================================================= */

input {
  width: 100%;
  padding: 12px;
  font-size: 17px;
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-top: 7px;
}

.footer {
  text-align: center;
  color: #8a7e78;
  font-size: 12px;
  margin: 20px 0;
}

.hidden {
  display: none;
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<div class="header">

  <h1>🛒 KASRIK BAKKAL</h1>

  <p>Preisfinder</p>

</div>


<!-- =======================================================
     GEMEINSAME SUCHLEISTE
     ======================================================= -->

<div class="box search-box">

  <div class="search-label">
    🔎 Suche
  </div>

  <input
    type="text"
    id="mainSearch"
    placeholder="Barcode, Marke, Produkt ..."
    autocomplete="off"
  >

  <div
    id="searchResults"
    class="search-results"
  ></div>

</div>


<!-- =======================================================
     SCANNER
     ======================================================= -->

<div class="box">

  <div class="section-title">
    📷 Barcode scannen
  </div>

  <div id="reader"></div>

  <div class="scanner-buttons">

    <button
      id="scanButton"
      class="bordeaux-button"
    >
      📷 Scanner starten
    </button>

    <button
      id="torchButton"
      class="gray-button"
    >
      🔦 Licht
    </button>

  </div>

</div>


<!-- =======================================================
     ERGEBNIS
     ======================================================= -->

<div class="box result">

  <div id="resultText">

    Bitte einen Barcode scannen oder einen Artikel suchen.

  </div>

</div>


<!-- =======================================================
     WARENKORB
     ======================================================= -->

<div class="box">

  <div class="section-title">
    🛒 Mein Warenkorb
  </div>


  <div id="cartItems">

    <div class="empty">
      Noch keine Artikel
    </div>

  </div>


  <div class="total">

    Gesamt:
    <span id="cartTotal">
      0,00 €
    </span>

  </div>


  <div class="center">

    <button
      id="shareButton"
      class="sand-button"
    >
      📤 Einkaufsliste teilen
    </button>


    <button
      id="clearButton"
      class="gray-button"
    >
      🗑️ Warenkorb leeren
    </button>

  </div>

</div>


<div class="footer">
  Kasrik Bakkal
</div>


<script>


/* =========================================================
   PRODUKTDATEN
   ========================================================= */

const PRODUCT_DATA_URL = "produkte.json";

let products = null;

let cart = {};

let scanner = null;

let scanning = false;

let alreadyScanned = false;

let torchOn = false;


/* =========================================================
   PRODUKTDATEN LADEN
   ========================================================= */

async function loadProducts() {

  if (products) {
    return products;
  }

  const response = await fetch(
    PRODUCT_DATA_URL + "?v=" + Date.now()
  );

  if (!response.ok) {

    throw new Error(
      "Produktdaten konnten nicht geladen werden."
    );

  }

  products = await response.json();

  return products;

}


/* =========================================================
   EINZELNES PRODUKT LADEN
   ========================================================= */

async function getProduct(code) {

  const data =
    await loadProducts();

  const cleanCode =
    String(code).trim();

  const product =
    data[cleanCode];

  if (!product) {
    return null;
  }

  return {

    code:
      String(product.barcode),

    name:
      product.produkt || "",

    price:
      Number(product.preis) || 0,

    marke:
      product.marke || "",

    paket:
      product.paket || "",

    einheit:
      product.einheit || ""

  };

}


/* =========================================================
   PREIS FORMATIEREN
   ========================================================= */

function formatPrice(price) {

  return Number(price)
    .toFixed(2)
    .replace(".", ",") + " €";

}


/* =========================================================
   HTML SICHER MACHEN
   ========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =========================================================
   PRODUKT ANZEIGEN
   ========================================================= */

async function showProduct(code) {

  const result =
    document.getElementById(
      "resultText"
    );

  result.innerHTML =
    "🔎 Preis wird gesucht...";


  try {

    const product =
      await getProduct(code);


    if (!product) {

      result.innerHTML =

        '<div class="not-found">' +

        '❌ Artikel nicht gefunden' +

        '<br><br>' +

        'EAN: ' +

        escapeHtml(code) +

        '</div>';

      return;

    }


    result.innerHTML =

      '<div class="brand">' +
      escapeHtml(product.marke) +
      '</div>' +

      '<div class="product">' +
      escapeHtml(product.name) +
      '</div>' +

      '<div class="package">' +
      escapeHtml(product.paket) +
      '</div>' +

      '<div class="price">' +
      formatPrice(product.price) +
      '</div>' +

      '<button ' +
      'id="addResultButton" ' +
      'class="bordeaux-button">' +

      '➕ In Warenkorb' +

      '</button>';


    const addButton =
      document.getElementById(
        "addResultButton"
      );


    addButton.addEventListener(
      "click",
      function() {

        addToCart(product);

      }
    );


  } catch (error) {

    console.error(error);

    result.innerHTML =

      '<div class="not-found">' +

      '❌ Produktdaten konnten nicht geladen werden.' +

      '<br><br>' +

      'Bitte erneut versuchen.' +

      '</div>';

  }

}


/* =========================================================
   WARENKORB – ARTIKEL HINZUFÜGEN
   ========================================================= */

function addToCart(product) {

  const code =
    product.code;


  if (cart[code]) {

    cart[code].quantity++;

  } else {

    cart[code] = {

      code:
        product.code,

      name:
        product.name,

      marke:
        product.marke,

      paket:
        product.paket,

      price:
        product.price,

      quantity:
        1

    };

  }


  updateCart();

}


/* =========================================================
   MENGE ÄNDERN
   ========================================================= */

function changeQuantity(
  code,
  change
) {

  if (!cart[code]) {
    return;
  }


  cart[code].quantity +=
    change;


  if (
    cart[code].quantity <= 0
  ) {

    delete cart[code];

  }


  updateCart();

}


/* =========================================================
   WARENKORB AKTUALISIEREN
   ========================================================= */

function updateCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  const codes =
    Object.keys(cart);


  if (codes.length === 0) {

    container.innerHTML =

      '<div class="empty">' +

      'Noch keine Artikel' +

      '</div>';


    document
      .getElementById("cartTotal")
      .textContent =
      "0,00 €";


    return;

  }


  container.innerHTML = "";

  let total = 0;


  codes.forEach(
    function(code) {

      const item =
        cart[code];


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      const itemBox =
        document.createElement(
          "div"
        );

      itemBox.className =
        "cart-item";


      /* Produktname */

      const name =
        document.createElement(
          "div"
        );

      name.className =
        "cart-name";

      name.textContent =
        item.name;


      /* Marke */

      const brand =
        document.createElement(
          "div"
        );

      brand.className =
        "cart-brand";

      brand.textContent =
        item.marke;


      /* Packung */

      const packageInfo =
        document.createElement(
          "div"
        );

      packageInfo.className =
        "cart-package";

      packageInfo.textContent =
        item.paket;


      /* Controls */

      const controls =
        document.createElement(
          "div"
        );

      controls.className =
        "cart-controls";


      const quantityControls =
        document.createElement(
          "div"
        );

      quantityControls.className =
        "quantity-controls";


      /* Minus */

      const minus =
        document.createElement(
          "button"
        );

      minus.className =
        "quantity-button";

      minus.textContent =
        "−";


      minus.addEventListener(
        "click",
        function() {

          changeQuantity(
            code,
            -1
          );

        }
      );


      /* Menge */

      const quantity =
        document.createElement(
          "span"
        );

      quantity.className =
        "quantity-number";

      quantity.textContent =
        item.quantity;


      /* Plus */

      const plus =
        document.createElement(
          "button"
        );

      plus.className =
        "quantity-button";

      plus.textContent =
        "+";


      plus.addEventListener(
        "click",
        function() {

          changeQuantity(
            code,
            1
          );

        }
      );


      quantityControls.appendChild(
        minus
      );

      quantityControls.appendChild(
        quantity
      );

      quantityControls.appendChild(
        plus
      );


      /* Preis */

      const price =
        document.createElement(
          "div"
        );

      price.className =
        "cart-price";

      price.textContent =
        formatPrice(
          itemTotal
        );


      controls.appendChild(
        quantityControls
      );

      controls.appendChild(
        price
      );


      itemBox.appendChild(
        name
      );


      if (item.marke) {

        itemBox.appendChild(
          brand
        );

      }


      if (item.paket) {

        itemBox.appendChild(
          packageInfo
        );

      }


      itemBox.appendChild(
        controls
      );


      container.appendChild(
        itemBox
      );

    }
  );


  document
    .getElementById("cartTotal")
    .textContent =
    formatPrice(total);

}


/* =========================================================
   WARENKORB LEEREN
   ========================================================= */

function clearCart() {

  cart = {};

  updateCart();


  /*
     Auch das zuletzt angezeigte
     Produkt löschen.
  */

  document
    .getElementById(
      "resultText"
    )
    .innerHTML =

      "Bitte einen Barcode scannen " +
      "oder einen Artikel suchen.";

}


/* =========================================================
   HAUPTSUCHE
   BARCODE + MARKE + PRODUKT + PACKUNG
   ========================================================= */

async function searchMain() {

  const input =
    document.getElementById(
      "mainSearch"
    );


  const search =
    input.value
      .trim()
      .toLowerCase();


  const container =
    document.getElementById(
      "searchResults"
    );


  /* Keine Eingabe */

  if (!search) {

    container.innerHTML = "";

    return;

  }


  container.innerHTML =
    "🔎 Suche...";


  try {

    const data =
      await loadProducts();


    /*
       Wenn es eine exakte
       Barcode-Suche ist,
       Produkt direkt anzeigen.
    */

    const exactProduct =
      data[input.value.trim()];


    if (exactProduct) {

      container.innerHTML = "";


      const result =
        document.createElement(
          "div"
        );

      result.className =
        "search-result";


      result.innerHTML =

        '<div class="search-result-brand">' +
        escapeHtml(
          exactProduct.marke || ""
        ) +
        '</div>' +

        '<div class="search-result-product">' +
        escapeHtml(
          exactProduct.produkt || ""
        ) +
        '</div>' +

        '<div class="search-result-package">' +
        escapeHtml(
          exactProduct.paket || ""
        ) +
        '</div>' +

        '<div class="search-result-price">' +
        formatPrice(
          exactProduct.preis
        ) +
        '</div>';


      result.addEventListener(
        "click",
        function() {

          showProduct(
            exactProduct.barcode
          );

          container.innerHTML = "";

        }
      );


      container.appendChild(
        result
      );


      return;

    }


    /*
       Normale Textsuche
    */

    const matches =
      Object.values(data)
        .filter(
          function(product) {

            const text =

              String(
                product.barcode || ""
              ) +

              " " +

              String(
                product.marke || ""
              ) +

              " " +

              String(
                product.produkt || ""
              ) +

              " " +

              String(
                product.paket || ""
              );


            return text
              .toLowerCase()
              .includes(search);

          }
        );


    if (
      matches.length === 0
    ) {

      container.innerHTML =

        '<div class="empty">' +

        'Keine Artikel gefunden.' +

        '</div>';

      return;

    }


    container.innerHTML = "";


    matches.forEach(
      function(product) {

        const result =
          document.createElement(
            "div"
          );

        result.className =
          "search-result";


        const brand =
          document.createElement(
            "div"
          );

        brand.className =
          "search-result-brand";

        brand.textContent =
          product.marke || "";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "search-result-product";

        name.textContent =
          product.produkt || "";


        const packageInfo =
          document.createElement(
            "div"
          );

        packageInfo.className =
          "search-result-package";

        packageInfo.textContent =
          product.paket || "";


        const price =
          document.createElement(
            "div"
          );

        price.className =
          "search-result-price";

        price.textContent =
          formatPrice(
            product.preis
          );


        result.appendChild(
          brand
        );

        result.appendChild(
          name
        );


        if (product.paket) {

          result.appendChild(
            packageInfo
          );

        }


        result.appendChild(
          price
        );


        /*
           WICHTIG:
           Nur Produkt anzeigen.
           NICHT automatisch
           zum Warenkorb hinzufügen.
        */

        result.addEventListener(
          "click",
          function() {

            showProduct(
              product.barcode
            );

            container.innerHTML = "";

          }
        );


        container.appendChild(
          result
        );

      }
    );


  } catch (error) {

    console.error(error);

    container.innerHTML =

      '<div class="not-found">' +

      '❌ Suche konnte nicht ausgeführt werden.' +

      '</div>';

  }

}


/* =========================================================
   SCANNER – ERFOLGREICHER SCAN
   ========================================================= */

function onScanSuccess(
  decodedText
) {

  if (alreadyScanned) {
    return;
  }


  alreadyScanned = true;


  showProduct(
    decodedText
  );


  stopScanner();

}


/* =========================================================
   SCANNER – FEHLER
   ========================================================= */

function onScanFailure(
  error
) {

  /*
     Normale Scanfehler
     werden ignoriert.
  */

}


/* =========================================================
   SCANNER STARTEN
   ========================================================= */

function startScanner() {

  if (scanning) {
    return;
  }


  alreadyScanned = false;


  /*
     Taschenlampenstatus
     für neuen Scan zurücksetzen.
  */

  torchOn = false;


  const torchButton =
    document.getElementById(
      "torchButton"
    );


  torchButton.textContent =
    "🔦 Licht";


  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  scanner.start(

    {
      facingMode:
        "environment"
    },

    {
      fps: 15,

      qrbox: {
        width: 280,
        height: 130
      }

    },

    onScanSuccess,

    onScanFailure

  )


  .then(
    function() {

      scanning = true;

    }
  )


  .catch(
    function(error) {

      console.error(error);

      scanning = false;


      document
        .getElementById(
          "resultText"
        )
        .innerHTML =

          '<div class="not-found">' +

          '❌ Kamera konnte nicht gestartet werden.' +

          '<br><br>' +

          'Bitte Kamera-Berechtigung prüfen.' +

          '</div>';

    }
  );

}


/* =========================================================
   SCANNER STOPPEN
   ========================================================= */

function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {
    return;
  }


  scanner.stop()

    .then(
      function() {

        scanning = false;

        /*
           Wichtig:
           Nach dem Scannen wird
           der Lichtstatus zurückgesetzt.
        */

        torchOn = false;


        document
          .getElementById(
            "torchButton"
          )
          .textContent =
          "🔦 Licht";

      }
    )


    .catch(
      function(error) {

        console.error(error);

        scanning = false;

        torchOn = false;


        document
          .getElementById(
            "torchButton"
          )
          .textContent =
          "🔦 Licht";

      }
    );

}


/* =========================================================
   TASCHENLAMPE
   ========================================================= */

async function toggleTorch() {

  if (
    !scanner ||
    !scanning
  ) {

    alert(
      "Bitte zuerst den Scanner starten."
    );

    return;

  }


  try {

    const capabilities =
      scanner.getRunningTrackCapabilities();


    if (
      !capabilities ||
      !capabilities.torch
    ) {

      alert(
        "Die Taschenlampe wird von diesem Handy bzw. Browser nicht unterstützt."
      );

      return;

    }


    torchOn =
      !torchOn;


    await scanner.applyVideoConstraints({

      advanced: [

        {
          torch:
            torchOn
        }

      ]

    });


    const button =
      document.getElementById(
        "torchButton"
      );


    button.textContent =

      torchOn

        ? "🔦 Licht aus"

        : "🔦 Licht";


  } catch (error) {

    console.error(error);

    alert(
      "Die Taschenlampe konnte nicht geschaltet werden."
    );

  }

}


/* =========================================================
   EINKAUFSLISTE TEILEN
   ========================================================= */

async function shareCart() {

  const codes =
    Object.keys(cart);


  if (
    codes.length === 0
  ) {

    alert(
      "Der Warenkorb ist noch leer."
    );

    return;

  }


  const now =
    new Date();


  const date =
    now.toLocaleDateString(
      "de-DE"
    );


  const time =
    now.toLocaleTimeString(
      "de-DE",
      {
        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );


  let text =
    "🛒 KASRIK BAKKAL\n";


  text +=
    "--------------------------------\n";


  text +=
    "Datum: " +
    date +
    "\n";


  text +=
    "Uhrzeit: " +
    time +
    "\n\n";


  let total = 0;


  codes.forEach(
    function(code) {

      const item =
        cart[code];


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      text +=
        (item.marke || "") +
        "\n";


      text +=
        (item.name || "") +
        "\n";


      text +=
        (item.paket || "") +
        "\n";


      text +=
        item.quantity +
        " × " +
        formatPrice(
          item.price
        ) +
        " = " +
        formatPrice(
          itemTotal
        ) +
        "\n\n";

    }
  );


  text +=
    "--------------------------------\n";


  text +=
    "GESAMT: " +
    formatPrice(total) +
    "\n\n";


  text +=
    "Vielen Dank für Ihren Einkauf!\n";


  text +=
    "Kasrik Bakkal";


  /*
     Handy-Teilen
  */

  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "Kasrik Bakkal Einkaufsliste",

        text:
          text

      });

    } catch (error) {

      console.log(
        "Teilen abgebrochen."
      );

    }


  } else {

    /*
       Falls navigator.share
       nicht verfügbar ist.
    */

    try {

      await navigator.clipboard
        .writeText(text);


      alert(
        "Einkaufsliste wurde kopiert."
      );


    } catch (error) {

      alert(text);

    }

  }

}
