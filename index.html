<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>Kasrik Bakkal – Preisfinder</title>

<script
  src="https://unpkg.com/html5-qrcode"
  type="text/javascript">
</script>

<style>

:root {
  --red: #b5121b;
  --dark: #171717;
  --gold: #d6a72c;
  --light: #f5f5f5;
  --green: #167447;
}

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  max-width: 600px;
  margin: 0 auto;
  padding: 12px;
  background: var(--light);
  color: var(--dark);
}

/* =========================
   KOPF
   ========================= */

.header {
  background: var(--dark);
  color: white;
  border-radius: 14px;
  padding: 16px;
  text-align: center;
  margin-bottom: 12px;
  border-bottom: 5px solid var(--gold);
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.header p {
  margin: 5px 0 0;
  color: #eee;
}


/* =========================
   SCANNER
   ========================= */

.scanner-box {
  background: white;
  border-radius: 14px;
  padding: 7px;
  margin-bottom: 10px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

#reader {
  max-width: 360px;
  margin: auto;
}

.scan-controls {
  text-align: center;
}


/* =========================
   BUTTONS
   ========================= */

button {
  border: none;
  border-radius: 9px;
  padding: 11px 16px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  margin: 4px;
}

.scan-button {
  background: var(--red);
  color: white;
}

.share-button {
  background: var(--gold);
  color: #171717;
}

.clear-button {
  background: #777;
  color: white;
}

.torch-button {
  background: #333;
  color: white;
}

.torch-button:disabled {
  background: #bbb;
  cursor: not-allowed;
}

.quantity-button {
  background: #eee;
  color: #111;
  padding: 6px 11px;
  margin: 0 3px;
}


/* =========================
   ERGEBNIS
   ========================= */

.result {
  background: white;
  border-radius: 14px;
  padding: 17px;
  text-align: center;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.product {
  font-size: 23px;
  font-weight: bold;
  margin-bottom: 5px;
}

.price {
  color: var(--red);
  font-size: 36px;
  font-weight: bold;
  margin-bottom: 10px;
}

input {
  width: 90%;
  padding: 11px;
  font-size: 17px;
  border: 1px solid #ccc;
  border-radius: 8px;
  margin-top: 8px;
}


/* =========================
   SUCHZEILEN
   ========================= */

.search-row {
  display: flex;
  gap: 6px;
  align-items: center;
  justify-content: center;
  margin-top: 8px;
}

.search-row input {
  width: 65%;
  margin-top: 0;
}

.search-row button {
  margin: 0;
}


/* =========================
   TEXTSUCHE
   ========================= */

.search-results {
  margin-top: 12px;
  text-align: left;
}

.search-result {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 9px;
  margin-top: 7px;
  background: #fafafa;
}

.search-result-info {
  flex: 1;
}

.search-result-price {
  font-weight: bold;
  color: var(--red);
  white-space: nowrap;
}


/* =========================
   PREISLISTE
   ========================= */

.price-list-box {
  background: white;
  border-radius: 14px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  text-align: center;
}

.price-list-button {
  background: var(--green);
  color: white;
  width: 90%;
}

.price-list-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  text-align: left;
  border-bottom: 1px solid #ddd;
  padding: 10px 4px;
}

.price-list-info {
  flex: 1;
}

.price-list-info span {
  color: #777;
  font-size: 14px;
}

.price-list-price {
  font-weight: bold;
  color: var(--red);
  white-space: nowrap;
}


/* =========================
   WARENKORB
   ========================= */

.cart {
  background: white;
  border-radius: 14px;
  padding: 17px;
  margin-top: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.cart-title {
  font-size: 22px;
  font-weight: bold;
  border-bottom: 3px solid var(--gold);
  padding-bottom: 8px;
  margin-bottom: 8px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 7px;
  border-bottom: 1px solid #ddd;
  padding: 10px 0;
}

.cart-name {
  flex: 1;
  text-align: left;
}

.cart-price {
  white-space: nowrap;
  font-weight: bold;
}

.total {
  font-size: 25px;
  font-weight: bold;
  text-align: right;
  margin-top: 15px;
  color: var(--red);
}

.cart-buttons {
  text-align: center;
  margin-top: 12px;
}


/* =========================
   SONSTIGES
   ========================= */

.empty {
  text-align: center;
  color: #777;
  padding: 12px;
}

.not-found {
  color: var(--red);
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #888;
  font-size: 12px;
  margin: 20px 0;
}


/* =========================
   HANDY
   ========================= */

@media (max-width: 480px) {

  .search-row {
    flex-direction: column;
  }

  .search-row input {
    width: 90%;
  }

  .search-row button {
    width: auto;
  }

  .cart-item {
    flex-wrap: wrap;
  }

}

</style>

</head>


<body>


<!-- =========================
     KOPF
     ========================= -->

<div class="header">

  <h1>🛒 KASRIK BAKKAL</h1>

  <p>Preisfinder</p>

</div>


<!-- =========================
     SCANNER
     ========================= -->

<div class="scanner-box">

  <div id="reader"></div>

</div>


<div class="scan-controls">

  <button
    class="scan-button"
    onclick="startScanner()">

    📷 Weiter scannen

  </button>

  <button
    id="torchButton"
    class="torch-button"
    onclick="toggleTorch()"
    disabled>

    🔦 Licht an

  </button>

</div>


<!-- =========================
     SUCHBEREICH
     ========================= -->

<div
  class="result"
  id="resultBox">


  <div id="resultText">

    Bitte einen Barcode scannen.

  </div>


  <!-- EAN MANUELL -->

  <div class="search-row">

    <input
      type="text"
      id="manualCode"
      placeholder="EAN manuell eingeben"
      inputmode="numeric">

    <button
      onclick="searchManual()">

      Preis suchen

    </button>

  </div>


  <!-- TEXTSUCHE -->

  <div class="search-row">

    <input
      type="text"
      id="textSearch"
      placeholder="Marke oder Produkt suchen">

    <button
      onclick="searchText()">

      🔎 Suchen

    </button>

  </div>


  <div
    id="searchResults"
    class="search-results">
  </div>


</div>


<!-- =========================
     PREISLISTE
     ========================= -->

<div class="price-list-box">

  <button
    class="price-list-button"
    onclick="togglePriceList()">

    📋 Preisliste anzeigen

  </button>


  <div
    id="priceList"
    style="display:none;">


    <input
      type="text"
      id="priceListSearch"
      placeholder="Preisliste durchsuchen..."
      oninput="filterPriceList()">


    <div id="priceListItems">

    </div>


  </div>

</div>


<!-- =========================
     WARENKORB
     ========================= -->

<div class="cart">


  <div class="cart-title">

    🛒 Mein Warenkorb

  </div>


  <div id="cartItems">

    <div class="empty">

      Noch keine Artikel

    </div>

  </div>


  <div class="total">

    Gesamt:

    <span id="cartTotal">

      0,00 €

    </span>

  </div>


  <div class="cart-buttons">


    <button
      class="scan-button"
      onclick="startScanner()">

      📷 Weiter scannen

    </button>

    <br>


    <button
      class="share-button"
      onclick="shareCart()">

      🧾 Rechnung teilen

    </button>

    <br>


    <button
      class="clear-button"
      onclick="clearCart()">

      🗑️ Warenkorb leeren

    </button>


  </div>

</div>


<div class="footer">

  Kasrik Bakkal

</div>



<script>


/* =====================================================
   PRODUKTDATEN
   ===================================================== */

const PRODUCT_DATA_URL = "produkte.json";

let products = null;


/* =====================================================
   PRODUKTDATEN LADEN
   ===================================================== */

async function loadProducts() {

  if (products) {

    return products;

  }


  const response = await fetch(
    PRODUCT_DATA_URL +
    "?v=" +
    Date.now()
  );


  if (!response.ok) {

    throw new Error(
      "Produktdaten konnten nicht geladen werden."
    );

  }


  products =
    await response.json();


  return products;

}


/* =====================================================
   PRODUKT SUCHEN
   ===================================================== */

async function getProduct(code) {

  const data =
    await loadProducts();


  const product =
    data[
      String(code).trim()
    ];


  if (!product) {

    return null;

  }


  return {

    code:
      String(product.barcode),

    name:
      product.produkt,

    price:
      Number(product.preis),

    marke:
      product.marke || "",

    paket:
      product.paket || "",

    einheit:
      product.einheit || ""

  };

}


/* =====================================================
   PREIS FORMATIEREN
   ===================================================== */

function formatPrice(price) {

  return Number(price)
    .toFixed(2)
    .replace(".", ",") +
    " €";

}


/* =====================================================
   HTML SICHER MACHEN
   ===================================================== */

function escapeHtml(value) {

  return String(
    value == null
      ? ""
      : value
  )

    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   PRODUKT ANZEIGEN
   ===================================================== */

async function showProduct(code) {

  const result =
    document.getElementById(
      "resultText"
    );


  result.innerHTML =
    "🔎 Preis wird gesucht...";


  try {

    const product =
      await getProduct(code);


    if (!product) {

      result.innerHTML =

        '<div class="not-found">' +

        'Artikel nicht gefunden' +

        '<br><br>' +

        'EAN: ' +

        escapeHtml(code) +

        '</div>';


      return;

    }


    result.innerHTML =

      '<div class="product">' +

      escapeHtml(
        product.name
      ) +

      '</div>' +


      '<div>' +

      escapeHtml(
        product.marke
      ) +

      (

        product.paket

          ? ' · ' +
            escapeHtml(
              product.paket
            )

          : ""

      ) +

      '</div>' +


      '<div class="price">' +

      formatPrice(
        product.price
      ) +

      '</div>';


    addToCart(product);


    setTimeout(function() {

      document
        .getElementById(
          "resultBox"
        )
        .scrollIntoView({

          behavior: "smooth",

          block: "start"

        });

    }, 100);


  }

  catch(error) {

    console.error(error);


    result.innerHTML =

      '<div class="not-found">' +

      'Preis konnte nicht geladen werden.' +

      '<br><br>' +

      'Bitte erneut versuchen.' +

      '</div>';

  }

}


/* =====================================================
   WARENKORB
   ===================================================== */

let cart = {};


function addToCart(product) {

  const code =
    product.code;


  if (cart[code]) {

    cart[code].quantity++;

  }

  else {

    cart[code] = {

      name:
        product.name,

      marke:
        product.marke || "",

      paket:
        product.paket || "",

      price:
        product.price,

      quantity:
        1

    };

  }


  updateCart();

}


/* =====================================================
   MENGE ÄNDERN
   ===================================================== */

function changeQuantity(
  code,
  change
) {

  if (!cart[code]) {

    return;

  }


  cart[code].quantity +=
    change;


  if (
    cart[code].quantity <= 0
  ) {

    delete cart[code];

  }


  updateCart();

}


/* =====================================================
   WARENKORB AKTUALISIEREN
   ===================================================== */

function updateCart() {

  const container =
    document.getElementById(
      "cartItems"
    );


  const codes =
    Object.keys(cart);


  if (
    codes.length === 0
  ) {

    container.innerHTML =

      '<div class="empty">' +

      'Noch keine Artikel' +

      '</div>';


    document
      .getElementById(
        "cartTotal"
      )
      .textContent =
        "0,00 €";


    return;

  }


  let html = "";

  let total = 0;


  codes.forEach(
    function(code) {

      const item =
        cart[code];


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      html +=

        '<div class="cart-item">' +


          '<div class="cart-name">' +

            '<strong>' +

            escapeHtml(
              item.marke || ""
            ) +

            '</strong><br>' +

            escapeHtml(
              item.name
            ) +

            (

              item.paket

                ? '<br><small>' +
                  escapeHtml(
                    item.paket
                  ) +
                  '</small>'

                : ""

            ) +

          '</div>' +


          '<div>' +

            '<button ' +

            'class="quantity-button" ' +

            'onclick="changeQuantity(\\'' +

            code +

            '\\', -1)">' +

            '−' +

            '</button>' +

            item.quantity +

            '<button ' +

            'class="quantity-button" ' +

            'onclick="changeQuantity(\\'' +

            code +

            '\\', 1)">' +

            '+' +

            '</button>' +

          '</div>' +


          '<div class="cart-price">' +

            formatPrice(
              itemTotal
            ) +

          '</div>' +


        '</div>';

    }
  );


  container.innerHTML =
    html;


  document
    .getElementById(
      "cartTotal"
    )
    .textContent =
      formatPrice(total);

}


/* =====================================================
   WARENKORB LEEREN
   ===================================================== */

function clearCart() {

  cart = {};

  updateCart();

}


/* =====================================================
   EAN MANUELL
   ===================================================== */

function searchManual() {

  const code =
    document

      .getElementById(
        "manualCode"
      )

      .value

      .trim();


  if (code) {

    showProduct(code);

  }

}


/* =====================================================
   TEXTSUCHE
   ===================================================== */

async function searchText() {

  const query =
    document

      .getElementById(
        "textSearch"
      )

      .value

      .trim()

      .toLowerCase();


  const resultsBox =
    document.getElementById(
      "searchResults"
    );


  if (
    query.length < 2
  ) {

    resultsBox.innerHTML =

      '<div class="empty">' +

      'Bitte mindestens 2 Zeichen eingeben.' +

      '</div>';

    return;

  }


  try {

    const data =
      await loadProducts();


    const matches =

      Object.values(data)

        .filter(
          function(product) {

            const searchable = [

              product.marke,

              product.produkt,

              product.paket

            ]

              .filter(Boolean)

              .join(" ")

              .toLowerCase();


            return searchable.includes(
              query
            );

          }
        )

        .slice(0, 50);


    if (
      matches.length === 0
    ) {

      resultsBox.innerHTML =

        '<div class="not-found">' +

        'Kein passender Artikel gefunden.' +

        '</div>';

      return;

    }


    resultsBox.innerHTML =

      matches

        .map(
          function(product) {

            const code =
              String(
                product.barcode
              );


            return

              '<div class="search-result">' +


                '<div class="search-result-info">' +

                  '<strong>' +

                  escapeHtml(
                    product.marke || ""
                  ) +

                  '</strong><br>' +

                  escapeHtml(
                    product.produkt || ""
                  ) +

                  (

                    product.paket

                      ? '<br><small>' +
                        escapeHtml(
                          product.paket
                        ) +
                        '</small>'

                      : ""

                  ) +

                '</div>' +


                '<div class="search-result-price">' +

                  formatPrice(
                    product.preis
                  ) +

                '</div>' +


                '<button ' +

                  'class="scan-button" ' +

                  'onclick="selectSearchResult(\\'' +

                  code +

                  '\\')">' +

                  '+' +

                '</button>' +


              '</div>';

          }
        )

        .join("");

  }


  catch(error) {

    console.error(error);


    resultsBox.innerHTML =

      '<div class="not-found">' +

      'Textsuche konnte nicht ausgeführt werden.' +

      '</div>';

  }

}


/* =====================================================
   TEXTSUCHERGEBNIS AUSWÄHLEN
   ===================================================== */

async function selectSearchResult(
  code
) {

  const product =
    await getProduct(code);


  if (!product) {

    return;

  }


  addToCart(product);


  document
    .getElementById(
      "resultText"
    )

    .innerHTML =

      '<div class="product">' +

      escapeHtml(
        product.name
      ) +

      '</div>' +

      '<div>' +

      escapeHtml(
        product.marke || ""
      ) +

      (

        product.paket

          ? ' · ' +
            escapeHtml(
              product.paket
            )

          : ""

      ) +

      '</div>' +

      '<div class="price">' +

      formatPrice(
        product.price
      ) +

      '</div>';

}


/* =====================================================
   PREISLISTE ÖFFNEN / SCHLIESSEN
   ===================================================== */

async function togglePriceList() {

  const list =
    document.getElementById(
      "priceList"
    );


  const button =
    document.querySelector(
      ".price-list-button"
    );


  if (
    list.style.display ===
    "none"
  ) {

    list.style.display =
      "block";


    button.textContent =
      "📋 Preisliste schließen";


    await renderPriceList();

  }

  else {

    list.style.display =
      "none";


    button.textContent =
      "📋 Preisliste anzeigen";

  }

}


/* =====================================================
   PREISLISTE LADEN
   ===================================================== */

async function renderPriceList() {

  const container =
    document.getElementById(
      "priceListItems"
    );


  try {

    const data =
      await loadProducts();


    const productsArray =
      Object.values(data);


    productsArray.sort(
      function(a, b) {

        const aText =

          (
            (a.marke || "") +
            " " +
            (a.produkt || "")
          )

          .toLowerCase();


        const bText =

          (
            (b.marke || "") +
            " " +
            (b.produkt || "")
          )

          .toLowerCase();


        return aText.localeCompare(
          bText
        );

      }
    );


    container.innerHTML =

      productsArray

        .map(
          function(product) {

            return

              '<div class="price-list-item">' +

                '<div class="price-list-info">' +

                  '<strong>' +

                  escapeHtml(
                    product.marke || ""
                  ) +

                  '</strong><br>' +

                  escapeHtml(
                    product.produkt || ""
                  ) +

                  (

                    product.paket

                      ? '<br><span>' +

                        escapeHtml(
                          product.paket
                        ) +

                        '</span>'

                      : ""

                  ) +

                '</div>' +

                '<div class="price-list-price">' +

                  formatPrice(
                    product.preis
                  ) +

                '</div>' +

              '</div>';

          }
        )

        .join("");

  }


  catch(error) {

    console.error(error);


    container.innerHTML =

      '<div class="not-found">' +

      'Preisliste konnte nicht geladen werden.' +

      '</div>';

  }

}


/* =====================================================
   PREISLISTE SUCHEN
   ===================================================== */

function filterPriceList() {

  const query =
    document

      .getElementById(
        "priceListSearch"
      )

      .value

      .trim()

      .toLowerCase();


  const items =
    document.querySelectorAll(
      ".price-list-item"
    );


  items.forEach(
    function(item) {

      const text =
        item.textContent
          .toLowerCase();


      item.style.display =

        text.includes(query)

          ? "flex"

          : "none";

    }
  );

}


/* =====================================================
   SCANNER
   ===================================================== */

let scanner = null;

let scanning = false;

let alreadyScanned = false;

let torchOn = false;


/* =====================================================
   SCAN ERFOLGREICH
   ===================================================== */

function onScanSuccess(
  decodedText
) {

  if (
    alreadyScanned
  ) {

    return;

  }


  alreadyScanned =
    true;


  showProduct(
    decodedText
  );


  stopScanner();

}


/* =====================================================
   SCAN FEHLER
   ===================================================== */

function onScanFailure(
  error
) {

  // Normale Scanfehler ignorieren.

}


/* =====================================================
   KAMERA STARTEN
   ===================================================== */

function startScanner() {

  if (scanning) {

    return;

  }


  alreadyScanned =
    false;


  if (!scanner) {

    scanner =
      new Html5Qrcode(
        "reader"
      );

  }


  scanner.start(

    {
      facingMode:
        "environment"
    },


    {

      fps: 15,

      qrbox: {

        width: 280,

        height: 130

      }

    },


    onScanSuccess,

    onScanFailure

  )


  .then(
    function() {

      scanning =
        true;

      torchOn =
        false;

      updateTorchButton();

    }
  )


  .catch(
    function(error) {

      console.error(error);


      scanning =
        false;


      document
        .getElementById(
          "resultText"
        )

        .innerHTML =

          '<div class="not-found">' +

          'Kamera konnte nicht gestartet werden.' +

          '<br><br>' +

          'Bitte Kamera-Berechtigung prüfen.' +

          '</div>';

    }
  );

}


/* =====================================================
   TASCHENLAMPE
   ===================================================== */

function updateTorchButton() {

  const button =
    document.getElementById(
      "torchButton"
    );


  if (!button) {

    return;

  }


  button.textContent =

    torchOn

      ? "🔦 Licht aus"

      : "🔦 Licht an";


  button.disabled =
    !scanning;

}


async function toggleTorch() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  try {

    const capabilities =
      scanner
        .getRunningTrackCapabilities();


    if (
      !capabilities ||
      !capabilities.torch
    ) {

      alert(
        "Die Taschenlampe wird von diesem Handy oder Browser nicht unterstützt."
      );

      return;

    }


    const newState =
      !torchOn;


    await scanner
      .applyVideoConstraints({

        advanced: [

          {
            torch:
              newState
          }

        ]

      });


    torchOn =
      newState;


    updateTorchButton();

  }


  catch(error) {

    console.error(error);

    alert(
      "Die Taschenlampe konnte nicht geschaltet werden."
    );

  }

}


/* =====================================================
   KAMERA STOPPEN
   ===================================================== */

function stopScanner() {

  if (
    !scanner ||
    !scanning
  ) {

    return;

  }


  scanner
    .stop()

    .then(
      function() {

        scanning =
          false;

        torchOn =
          false;

        updateTorchButton();

      }
    )

    .catch(
      function() {

        scanning =
          false;

        torchOn =
          false;

        updateTorchButton();

      }
    );

}


/* =====================================================
   RECHNUNG TEILEN
   ===================================================== */

async function shareCart() {

  const codes =
    Object.keys(cart);


  if (
    codes.length === 0
  ) {

    alert(
      "Der Warenkorb ist noch leer."
    );

    return;

  }


  const now =
    new Date();


  const date =
    now.toLocaleDateString(
      "de-DE"
    );


  const time =
    now.toLocaleTimeString(
      "de-DE",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );


  let total =
    0;


  let text =

    "🛒 KASRIK BAKKAL\n" +

    "--------------------------------\n" +

    "Datum: " +
    date +
    "\n" +

    "Uhrzeit: " +
    time +
    "\n\n";


  codes.forEach(
    function(code) {

      const item =
        cart[code];


      const itemTotal =
        item.price *
        item.quantity;


      total +=
        itemTotal;


      text +=

        (
          item.marke ||
          ""
        ) +

        "\n";


      text +=

        (
          item.name ||
          ""
        ) +

        "\n";


      if (
        item.paket
      ) {

        text +=
          item.paket +
          "\n";

      }


      text +=

        item.quantity +

        " × " +

        formatPrice(
          item.price
        ) +

        " = " +

        formatPrice(
          itemTotal
        ) +

        "\n\n";

    }
  );


  text +=

    "--------------------------------\n" +

    "GESAMT: " +

    formatPrice(
      total
    ) +

    "\n\n" +

    "Vielen Dank für Ihren Einkauf!\n" +

    "Kasrik Bakkal";


  if (
    navigator.share
  ) {

    try {

      await navigator.share({

        title:
          "Kasrik Bakkal Einkauf",

        text:
          text

      });

    }

    catch(error) {

      // Teilen abgebrochen.

    }

  }

  else {

    try {

      await navigator
        .clipboard
        .writeText(
          text
        );


      alert(
        "Rechnung wurde kopiert."
      );

    }

    catch(error) {

      alert(text);

    }

  }

}
