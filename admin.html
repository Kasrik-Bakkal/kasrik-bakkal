<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasrik Bakkal – Admin</title><style>:root{--b:#672635;--s:#C8B08E;--bg:#F6F0E5;--card:#fffaf2;--t:#332a27;--m:#756962;--d:#a12f3f;--bd:#dfd2c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}header{background:var(--b);color:#fff;padding:18px 20px;box-shadow:0 3px 12px #0002}.hi,main{max-width:1100px;margin:auto}.hi h1{margin:0;font-size:23px}.sub{margin-top:5px;opacity:.82;font-size:14px}main{padding:22px 14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 3px 12px #0000000d}h2{margin:0 0 14px;color:var(--b);font-size:20px}.login{max-width:480px;margin:45px auto}label{display:block;font-weight:700;font-size:14px;margin:10px 0 6px}input{width:100%;padding:11px 12px;border:1px solid #cdbda8;border-radius:9px;background:#fff;font-size:15px;color:var(--t)}button{border:0;border-radius:9px;padding:10px 15px;font-size:14px;font-weight:700;cursor:pointer}.p{background:var(--b);color:#fff}.sec{background:#eadfce;color:var(--b)}.danger{background:var(--d);color:#fff}button:disabled{opacity:.5;cursor:not-allowed}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{margin-top:12px;min-height:20px;font-size:14px;color:var(--m)}.ok{color:#287047}.err{color:var(--d)}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input{flex:1;min-width:220px}.wrap{overflow:auto;border:1px solid var(--bd);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:850px;background:#fff}th,td{padding:9px 10px;border-bottom:1px solid #eadfce;text-align:left;font-size:13px;vertical-align:middle}th{background:#eee3d3;color:var(--b);position:sticky;top:0}.small{font-size:12px;color:var(--m)}.hidden{display:none!important}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 12px}.full{grid-column:1/-1}@media(max-width:720px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.hi h1{font-size:20px}}</style></head><body><header><div class="hi"><h1>🛒 KASRIK BAKKAL – ADMIN</h1><div class="sub">Produktdaten verwalten</div></div></header><main><section id="login" class="card login"><h2>🔐 Admin-Anmeldung</h2><label>Passwort</label><input id="pw" type="password" autocomplete="current-password" placeholder="Admin-Passwort"><div class="acts"><button class="p" id="loginBtn">Anmelden</button></div><div id="loginStatus" class="status"></div></section><section id="admin" class="hidden"><div class="card"><div class="toolbar"><input id="search" type="search" placeholder="🔎 Barcode, Marke, Produkt, Paket ..."><button class="sec" id="new">➕ Neues Produkt</button><button class="sec" id="reload">↻ Aktualisieren</button><button class="sec" id="logout">Abmelden</button></div><div id="listStatus" class="status"></div><div class="wrap"><table><thead><tr><th>Barcode / EAN</th><th>Marke</th><th>Produkt</th><th>Preis</th><th>Paket</th><th>Einheit</th><th>Aktionen</th></tr></thead><tbody id="rows"></tbody></table></div><div class="small" id="count"></div></div><section id="edit" class="card hidden"><h2 id="editTitle">➕ Neues Produkt</h2><div class="grid"><div><label>Barcode / EAN *</label><input id="barcode" inputmode="numeric"></div><div><label>Marke</label><input id="brand"></div><div><label>Produkt *</label><input id="product"></div><div><label>Preis *</label><input id="price" inputmode="decimal" placeholder="z. B. 1,39"></div><div><label>Paket</label><input id="pack" placeholder="z. B. 400 g"></div><div><label>Einheit</label><input id="unit" placeholder="z. B. Stück / kg"></div></div><div class="acts"><button class="p" id="save">💾 Speichern</button><button class="sec" id="cancel">Abbrechen</button></div><div id="editStatus" class="status"></div></section></section></main><script>
const API="https://script.google.com/macros/s/AKfycbxA6kCXYz0TXspy5RSoySzVdNBx0zU42ITnkaVtx6ezqh8rdfXRaglgB42rBa-u618/exec";
let token=null,products=[],editingRow=null;
const $=id=>document.getElementById(id), clean=v=>v==null?"":String(v);
function st(el,msg,ok=false){el.textContent=msg||"";el.className="status"+(msg?(ok?" ok":" err"):"")}
async function get(p){const r=await fetch(API+"?"+new URLSearchParams(p),{cache:"no-store"}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error("Ungültige Antwort vom Web-App-Server.")}if(!r.ok||d.error)throw Error(d.error||"Serverfehler");return d}
async function post(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}),t=await r.text();let d;try{d=JSON.parse(t)}catch{throw Error("Ungültige Antwort vom Web-App-Server.")}if(!r.ok||d.error)throw Error(d.error||"Serverfehler");return d}
async function login(){let pw=$("pw").value.trim();if(!pw)return st($("loginStatus"),"Bitte Passwort eingeben.");$("loginBtn").disabled=true;st($("loginStatus"),"Anmeldung wird geprüft...",true);try{let d=await get({action:"adminLogin",password:pw});token=d.token;$("pw").value="";$("login").classList.add("hidden");$("admin").classList.remove("hidden");await load()}catch(e){token=null;st($("loginStatus"),e.message)}finally{$("loginBtn").disabled=false}}
async function load(){st($("listStatus"),"Produktdaten werden geladen...",true);try{let d=await get({action:"adminList",token});products=Array.isArray(d.products)?d.products:[];render();st($("listStatus"),"Produktdaten geladen.",true)}catch(e){st($("listStatus"),e.message);if((e.message||"").toLowerCase().includes("token"))logout()}}
function esc(v){return clean(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]))}
function render(){let q=$("search").value.trim().toLowerCase(),a=products.filter(p=>[p.barcode,p.marke,p.produkt,p.preis,p.paket,p.einheit].map(clean).join(" ").toLowerCase().includes(q));$("rows").innerHTML="";a.forEach(p=>{let tr=document.createElement("tr");tr.innerHTML=`<td>${esc(p.barcode)}</td><td>${esc(p.marke)}</td><td>${esc(p.produkt)}</td><td>${esc(p.preis)}</td><td>${esc(p.paket)}</td><td>${esc(p.einheit)}</td><td><button class="sec editBtn">✏️ Bearbeiten</button> <button class="danger delBtn">🗑️ Löschen</button></td>`;tr.querySelector(".editBtn").onclick=()=>openEdit(p);tr.querySelector(".delBtn").onclick=()=>del(p);$("rows").appendChild(tr)});$("count").textContent=`${a.length} von ${products.length} Produkten`}
function openNew(){editingRow=null;$("editTitle").textContent="➕ Neues Produkt";["barcode","brand","product","price","pack","unit"].forEach(id=>$(id).value="");$("edit").classList.remove("hidden");st($("editStatus"),"");$("barcode").focus();$("edit").scrollIntoView({behavior:"smooth"})}
function openEdit(p){editingRow=p.row;$("editTitle").textContent="✏️ Produkt bearbeiten";$("barcode").value=clean(p.barcode);$("brand").value=clean(p.marke);$("product").value=clean(p.produkt);$("price").value=clean(p.preis);$("pack").value=clean(p.paket);$("unit").value=clean(p.einheit);$("edit").classList.remove("hidden");st($("editStatus"),"");$("edit").scrollIntoView({behavior:"smooth"})}
async function save(){let barcode=$("barcode").value.trim(),product=$("product").value.trim(),price=$("price").value.trim();if(!barcode||!product||!price)return st($("editStatus"),"Barcode, Produkt und Preis sind Pflichtfelder.");$("save").disabled=true;st($("editStatus"),"Wird gespeichert...",true);try{let d=await post({action:"adminSave",token,row:editingRow,barcode,marke:$("brand").value.trim(),produkt:product,preis:price,paket:$("pack").value.trim(),einheit:$("unit").value.trim()});st($("editStatus"),d.message||"Gespeichert.",true);await load();close()}catch(e){st($("editStatus"),e.message)}finally{$("save").disabled=false}}
async function del(p){if(!confirm(`Produkt wirklich löschen?\n\n${[p.marke,p.produkt,p.paket].filter(Boolean).join(" ")||p.barcode}`))return;try{st($("listStatus"),"Wird gelöscht...",true);let d=await post({action:"adminDelete",token,row:p.row,barcode:p.barcode});st($("listStatus"),d.message||"Gelöscht.",true);await load()}catch(e){st($("listStatus"),e.message)}}
function close(){$("edit").classList.add("hidden");editingRow=null}
function logout(){token=null;products=[];close();$("admin").classList.add("hidden");$("login").classList.remove("hidden");$("pw").value="";st($("loginStatus"),"Abgemeldet.",true)}
$("loginBtn").onclick=login;$("pw").onkeydown=e=>{if(e.key==="Enter")login()};$("search").oninput=render;$("new").onclick=openNew;$("reload").onclick=load;$("logout").onclick=logout;$("save").onclick=save;$("cancel").onclick=close;
</script></body></html>
