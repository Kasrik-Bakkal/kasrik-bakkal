<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kasrik Bakkal – Admin</title>

  <style>

    /* =========================================================
       1. GRUNDVARIABLEN
       ========================================================= */

    :root {
      --b: #672635;
      --s: #C8B08E;
      --bg: #F6F0E5;
      --card: #fffaf2;
      --t: #332a27;
      --m: #756962;
      --d: #a12f3f;
      --bd: #dfd2c0;
    }


    /* =========================================================
       2. GRUNDLAYOUT
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--t);
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--b);
      color: #fff;
      padding: 18px 20px;
      box-shadow: 0 3px 12px #0002;
    }

    .hi,
    main {
      max-width: 1100px;
      margin: auto;
    }

    .hi h1 {
      margin: 0;
      font-size: 23px;
    }

    .sub {
      margin-top: 5px;
      opacity: .82;
      font-size: 14px;
    }

    main {
      padding: 22px 14px;
    }


    /* =========================================================
       3. KARTEN
       ========================================================= */

    .card {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px #0000000d;
    }

    h2 {
      margin: 0 0 14px;
      color: var(--b);
      font-size: 20px;
    }


    /* =========================================================
       4. LOGIN
       ========================================================= */

    .login {
      max-width: 480px;
      margin: 45px auto;
    }


    /* =========================================================
       5. FORMULARE
       ========================================================= */

    label {
      display: block;
      font-weight: 700;
      font-size: 14px;
      margin: 10px 0 6px;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #cdbda8;
      border-radius: 9px;
      background: #fff;
      font-size: 15px;
      color: var(--t);
    }


    /* =========================================================
       6. BUTTONS
       ========================================================= */

    button {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .p {
      background: var(--b);
      color: #fff;
    }

    .sec {
      background: #eadfce;
      color: var(--b);
    }

    .danger {
      background: var(--d);
      color: #fff;
    }

    .acts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }


    /* =========================================================
       7. STATUSMELDUNGEN
       ========================================================= */

    .status {
      margin-top: 12px;
      min-height: 20px;
      font-size: 14px;
      color: var(--m);
    }

    .ok {
      color: #287047;
    }

    .err {
      color: var(--d);
    }


    /* =========================================================
       8. ADMIN-WERKZEUGLEISTE
       ========================================================= */

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .toolbar input {
      flex: 1;
      min-width: 220px;
    }


    /* =========================================================
       9. PRODUKTTABELLE
       ========================================================= */

    .wrap {
      overflow: auto;
      border: 1px solid var(--bd);
      border-radius: 10px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 850px;
      background: #fff;
    }

    th,
    td {
      padding: 9px 10px;
      border-bottom: 1px solid #eadfce;
      text-align: left;
      font-size: 13px;
      vertical-align: middle;
    }

    th {
      background: #eee3d3;
      color: var(--b);
      position: sticky;
      top: 0;
    }

    .small {
      font-size: 12px;
      color: var(--m);
    }


    /* =========================================================
       10. PRODUKT-BEARBEITUNG
       ========================================================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px 12px;
    }

    .full {
      grid-column: 1 / -1;
    }


    /* =========================================================
       11. HILFSKLASSEN
       ========================================================= */

    .hidden {
      display: none !important;
    }


    /* =========================================================
       12. MOBILE
       ========================================================= */

    @media (max-width: 720px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .hi h1 {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================================================
       HEADER
       ========================================================= -->

  <header>

    <div class="hi">

      <h1>
        🛒 KASRIK BAKKAL – ADMIN
      </h1>

      <div class="sub">
        Produktdaten verwalten
      </div>

    </div>

  </header>


  <main>


    <!-- =======================================================
         LOGIN
         ======================================================= -->

    <section
      id="login"
      class="card login"
    >

      <h2>
        🔐 Admin-Anmeldung
      </h2>

      <label>
        Passwort
      </label>

      <input
        id="pw"
        type="password"
        autocomplete="current-password"
        placeholder="Admin-Passwort"
      >

      <div class="acts">

        <button
          class="p"
          id="loginBtn"
        >
          Anmelden
        </button>

      </div>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </section>


    <!-- =======================================================
         ADMIN-BEREICH
         ======================================================= -->

    <section
      id="admin"
      class="hidden"
    >


      <!-- =====================================================
           PRODUKTÜBERSICHT
           ===================================================== -->

      <div class="card">

        <div class="toolbar">

          <input
            id="search"
            type="search"
            placeholder="🔎 Barcode, Marke, Produkt, Paket ..."
          >

          <button
            class="sec"
            id="new"
          >
            ➕ Neues Produkt
          </button>

          <button
            class="sec"
            id="reload"
          >
            ↻ Aktualisieren
          </button>

          <button
            class="sec"
            id="logout"
          >
            Abmelden
          </button>

        </div>


        <div
          id="listStatus"
          class="status"
        ></div>


        <div class="wrap">

          <table>

            <thead>

              <tr>

                <th>Barcode / EAN</th>
                <th>Marke</th>
                <th>Produkt</th>
                <th>Preis</th>
                <th>Paket</th>
                <th>Einheit</th>
                <th>Aktionen</th>

              </tr>

            </thead>

            <tbody id="rows"></tbody>

          </table>

        </div>


        <div
          class="small"
          id="count"
        ></div>

      </div>


      <!-- =====================================================
           PRODUKT BEARBEITEN / NEU
           ===================================================== -->

      <section
        id="edit"
        class="card hidden"
      >

        <h2 id="editTitle">
          ➕ Neues Produkt
        </h2>


        <div class="grid">


          <div>

            <label>
              Barcode / EAN *
            </label>

            <input
              id="barcode"
              inputmode="numeric"
            >

          </div>


          <div>

            <label>
              Marke
            </label>

            <input
              id="brand"
            >

          </div>


          <div>

            <label>
              Produkt *
            </label>

            <input
              id="product"
            >

          </div>


          <div>

            <label>
              Preis *
            </label>

            <input
              id="price"
              inputmode="decimal"
              placeholder="z. B. 1,39"
            >

          </div>


          <div>

            <label>
              Paket
            </label>

            <input
              id="pack"
              placeholder="z. B. 400 g"
            >

          </div>


          <div>

            <label>
              Einheit
            </label>

            <input
              id="unit"
              placeholder="z. B. Stück / kg"
            >

          </div>

        </div>


        <div class="acts">

          <button
            class="p"
            id="save"
          >
            💾 Speichern
          </button>

          <button
            class="sec"
            id="cancel"
          >
            Abbrechen
          </button>

        </div>


        <div
          id="editStatus"
          class="status"
        ></div>

      </section>

    </section>

  </main>


  <!-- =========================================================
       JAVASCRIPT
       ========================================================= -->

  <script>


    /* =========================================================
       1. API / GLOBALE VARIABLEN
       ========================================================= */

    const API =
      "https://script.google.com/macros/s/AKfycbxA6kCXYz0TXspy5RSoySzVdNWBx0zU42ITnkaVtx6ezqh8rdfXRaglgB42rBa-u618/exec";

    let token = null;

    let products = [];

    let editingRow = null;


    /* =========================================================
       2. HILFSFUNKTIONEN
       ========================================================= */

    const $ = id =>
      document.getElementById(id);


    function clean(value) {

      return value == null
        ? ""
        : String(value);

    }


    function setStatus(
      element,
      message,
      success = false
    ) {

      element.textContent =
        message || "";

      element.className =
        "status" +
        (
          message
            ? (success ? " ok" : " err")
            : ""
        );

    }


    function escapeHtml(value) {

      return clean(value)
        .replace(
          /[&<>"']/g,
          character => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[character])
        );

    }


    /* =========================================================
       3. API – GET
       ========================================================= */

    async function get(params) {

      const response =
        await fetch(
          API +
          "?" +
          new URLSearchParams(params),
          {
            cache: "no-store"
          }
        );


      const text =
        await response.text();


      let data;

      try {

        data =
          JSON.parse(text);

      }

      catch {

        throw new Error(
          "Ungültige Antwort vom Web-App-Server."
        );

      }


      if (
        !response.ok ||
        data.error
      ) {

        throw new Error(
          data.error ||
          "Serverfehler"
        );

      }


      return data;

    }


    /* =========================================================
       4. API – POST
       ========================================================= */

    async function post(body) {

      const response =
        await fetch(
          API,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(body)
          }
        );


      const text =
        await response.text();


      let data;

      try {

        data =
          JSON.parse(text);

      }

      catch {

        throw new Error(
          "Ungültige Antwort vom Web-App-Server."
        );

      }


      if (
        !response.ok ||
        data.error
      ) {

        throw new Error(
          data.error ||
          "Serverfehler"
        );

      }


      return data;

    }


    /* =========================================================
       5. LOGIN
       ========================================================= */

    async function login() {

      const password =
        $("pw").value.trim();


      if (!password) {

        setStatus(
          $("loginStatus"),
          "Bitte Passwort eingeben."
        );

        return;

      }


      $("loginBtn").disabled =
        true;


      setStatus(
        $("loginStatus"),
        "Anmeldung wird geprüft...",
        true
      );


      try {

        const data =
          await get({
            action: "adminLogin",
            password: password
          });


        token =
          data.token;


        $("pw").value =
          "";


        $("login")
          .classList
          .add("hidden");


        $("admin")
          .classList
          .remove("hidden");


        await load();

      }


      catch (error) {

        token =
          null;


        setStatus(
          $("loginStatus"),
          error.message
        );

      }


      finally {

        $("loginBtn").disabled =
          false;

      }

    }


    /* =========================================================
       6. PRODUKTE LADEN
       ========================================================= */

    async function load() {

      setStatus(
        $("listStatus"),
        "Produktdaten werden geladen...",
        true
      );


      try {

        const data =
          await get({
            action: "adminList",
            token: token
          });


        products =
          Array.isArray(data.products)
            ? data.products
            : [];


        render();


        setStatus(
          $("listStatus"),
          "Produktdaten geladen.",
          true
        );

      }


      catch (error) {

        setStatus(
          $("listStatus"),
          error.message
        );


        if (
          (error.message || "")
            .toLowerCase()
            .includes("token")
        ) {

          logout();

        }

      }

    }


    /* =========================================================
       7. PRODUKTE DARSTELLEN
       ========================================================= */

    function render() {

      const query =
        $("search")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        products.filter(product =>

          [
            product.barcode,
            product.marke,
            product.produkt,
            product.preis,
            product.paket,
            product.einheit
          ]
            .map(clean)
            .join(" ")
            .toLowerCase()
            .includes(query)

        );


      $("rows")
        .innerHTML = "";


      filtered.forEach(product => {

        const row =
          document.createElement("tr");


        row.innerHTML = `

          <td>
            ${escapeHtml(product.barcode)}
          </td>

          <td>
            ${escapeHtml(product.marke)}
          </td>

          <td>
            ${escapeHtml(product.produkt)}
          </td>

          <td>
            ${escapeHtml(product.preis)}
          </td>

          <td>
            ${escapeHtml(product.paket)}
          </td>

          <td>
            ${escapeHtml(product.einheit)}
          </td>

          <td>

            <button
              class="sec editBtn"
            >
              ✏️ Bearbeiten
            </button>

            <button
              class="danger delBtn"
            >
              🗑️ Löschen
            </button>

          </td>

        `;


        row
          .querySelector(".editBtn")
          .onclick =
            () => openEdit(product);


        row
          .querySelector(".delBtn")
          .onclick =
            () => del(product);


        $("rows")
          .appendChild(row);

      });


      $("count").textContent =
        `${filtered.length} von ${products.length} Produkten`;

    }


    /* =========================================================
       8. NEUES PRODUKT
       ========================================================= */

    function openNew() {

      editingRow =
        null;


      $("editTitle").textContent =
        "➕ Neues Produkt";


      [
        "barcode",
        "brand",
        "product",
        "price",
        "pack",
        "unit"
      ]
        .forEach(
          id => $(id).value = ""
        );


      $("edit")
        .classList
        .remove("hidden");


      setStatus(
        $("editStatus"),
        ""
      );


      $("barcode")
        .focus();


      $("edit")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    /* =========================================================
       9. PRODUKT BEARBEITEN
       ========================================================= */

    function openEdit(product) {

      editingRow =
        product.row;


      $("editTitle").textContent =
        "✏️ Produkt bearbeiten";


      $("barcode").value =
        clean(product.barcode);

      $("brand").value =
        clean(product.marke);

      $("product").value =
        clean(product.produkt);

      $("price").value =
        clean(product.preis);

      $("pack").value =
        clean(product.paket);

      $("unit").value =
        clean(product.einheit);


      $("edit")
        .classList
        .remove("hidden");


      setStatus(
        $("editStatus"),
        ""
      );


      $("edit")
        .scrollIntoView({
          behavior: "smooth"
        });

    }


    /* =========================================================
       10. PRODUKT SPEICHERN
       ========================================================= */

    async function save() {

      const barcode =
        $("barcode")
          .value
          .trim();


      const product =
        $("product")
          .value
          .trim();


      const price =
        $("price")
          .value
          .trim();


      if (
        !barcode ||
        !product ||
        !price
      ) {

        setStatus(
          $("editStatus"),
          "Barcode, Produkt und Preis sind Pflichtfelder."
        );

        return;

      }


      $("save").disabled =
        true;


      setStatus(
        $("editStatus"),
        "Wird gespeichert...",
        true
      );


      try {

        const data =
          await post({

            action: "adminSave",

            token: token,

            row: editingRow,

            barcode: barcode,

            marke:
              $("brand")
                .value
                .trim(),

            produkt:
              product,

            preis:
              price,

            paket:
              $("pack")
                .value
                .trim(),

            einheit:
              $("unit")
                .value
                .trim()

          });


        setStatus(
          $("editStatus"),
          data.message ||
          "Gespeichert.",
          true
        );


        await load();

        close();

      }


      catch (error) {

        setStatus(
          $("editStatus"),
          error.message
        );

      }


      finally {

        $("save").disabled =
          false;

      }

    }


    /* =========================================================
       11. PRODUKT LÖSCHEN
       ========================================================= */

    async function del(product) {

      const name =
        [
          product.marke,
          product.produkt,
          product.paket
        ]
          .filter(Boolean)
          .join(" ") ||
          product.barcode;


      if (
        !confirm(
          `Produkt wirklich löschen?\n\n${name}`
        )
      ) {

        return;

      }


      try {

        setStatus(
          $("listStatus"),
          "Wird gelöscht...",
          true
        );


        const data =
          await post({

            action: "adminDelete",

            token: token,

            row: product.row,

            barcode: product.barcode

          });


        setStatus(
          $("listStatus"),
          data.message ||
          "Gelöscht.",
          true
        );


        await load();

      }


      catch (error) {

        setStatus(
          $("listStatus"),
          error.message
        );

      }

    }


    /* =========================================================
       12. BEARBEITUNG SCHLIESSEN
       ========================================================= */

    function close() {

      $("edit")
        .classList
        .add("hidden");


      editingRow =
        null;

    }


    /* =========================================================
       13. LOGOUT
       ========================================================= */

    function logout() {

      token =
        null;

      products =
        [];

      close();


      $("admin")
        .classList
        .add("hidden");


      $("login")
        .classList
        .remove("hidden");


      $("pw").value =
        "";


      setStatus(
        $("loginStatus"),
        "Abgemeldet.",
        true
      );

    }


    /* =========================================================
       14. EVENT-HANDLER
       ========================================================= */

    $("loginBtn")
      .onclick =
        login;


    $("pw")
      .onkeydown =
        event => {

          if (
            event.key === "Enter"
          ) {

            login();

          }

        };


    $("search")
      .oninput =
        render;


    $("new")
      .onclick =
        openNew;


    $("reload")
      .onclick =
        load;


    $("logout")
      .onclick =
        logout;


    $("save")
      .onclick =
        save;


    $("cancel")
      .onclick =
        close;


  </script>

</body>

</html>
